name: Prepare original retention guard v128
on:
  push:
    branches: [fix/retain-correction-originals-v1.2.8]
    paths: [.github/workflows/prepare-original-retention-v128.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply narrow cleanup guard and bump patch version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          assert Path('VERSION').read_text().strip()=='v1.2.7'
          token=re.search(r'var tokenCodes = \[[^\]]+\]',Path('upload-config.js').read_text()).group()
          p=Path('.github/workflows/import-chunked.yml');s=p.read_text()
          old='          git push origin --delete "$SOURCE_BRANCH" || true'
          new='''          if [ "$(python3 scripts/retain-quality-originals.py)" = "keep" ]; then
            echo "已保留原始上传暂存分支用于单位订正追溯：$SOURCE_BRANCH"
          else
            git push origin --delete "$SOURCE_BRANCH" || true
          fi'''
          assert old in s;s=s.replace(old,new);p.write_text(s);Path('.github/import-chunked-v128.yml').write_text(s)
          p=Path('.github/workflows/unit-evidence-tests.yml');s=p.read_text();assert 'python scripts/test-unit-correction.py' in s
          s=s.replace('          python scripts/test-unit-correction.py','          python scripts/test-original-retention.py\n          python scripts/test-unit-correction.py');Path('.github/unit-evidence-tests-v128.yml').write_text(s)
          p=Path('CHANGELOG.md');s=p.read_text();p.write_text(s.replace('# Changelog\n','# Changelog\n\n## v1.2.8 — 2026-09-23\n\n- 完善单位订正原件保护：后续上传只要报告正文文件或平台单位归属经过自动订正，就保留原始暂存分支及清单，不再按普通上传的清理逻辑删除。审计缺失或无法确认时同样保留；未订正和参考资料上传仍按原规则清理。\n- 不再修改已核验的6份报告、10个挂载关联及原通讯录，补充原件保留/清理边界测试。\n',1))
          p=Path('MAINTENANCE_RULES.md');p.write_text(p.read_text()+'\n- 自动单位订正的新上传必须保留原始暂存分支和原始清单，禁止在成功后按普通文件清理掉唯一原件；证据缺失时默认保留。\n')
          subprocess.run(['node','scripts/bump-version.js','patch'],check=True)
          assert token==re.search(r'var tokenCodes = \[[^\]]+\]',Path('upload-config.js').read_text()).group()
          PY
          python3 scripts/test-original-retention.py
          node scripts/validate-project.js
          node scripts/validate-workspace.js
          git diff --quiet -- task-unit-mappings.js data replies work-records.js work-records-core.js
      - name: Commit ordinary version and guard files only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/retain-correction-originals-v1.2.8'
          git restore --source=HEAD -- .github/workflows/import-chunked.yml
          git add -u
          git add .github/import-chunked-v128.yml .github/unit-evidence-tests-v128.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve original quality uploads after evidence-based corrections'
          git push origin HEAD:fix/retain-correction-originals-v1.2.8
