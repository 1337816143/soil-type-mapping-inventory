name: Validate cleanup YAML v128
on:
  push:
    branches: [fix/retain-correction-originals-v1.2.8]
    paths: [.github/workflows/repair-cleanup-yaml-v128.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: python3 -m pip install PyYAML==6.0.2
      - name: Normalize only final cleanup block and add parser regression
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml,subprocess
          p=Path('.github/workflows/import-chunked.yml');s=p.read_text();marker='          if [ "$(python3 scripts/retain-quality-originals.py)"'
          start=s.index(marker);tail=s[start:];assert tail.strip().endswith('fi') and len(tail.splitlines())==5
          s=s[:start]+'\n'.join('          '+line.strip() for line in tail.splitlines())+'\n'
          parsed=yaml.safe_load(s);run=parsed['jobs']['import']['steps'][-1]['run'];subprocess.run(['bash','-n'],input=run,text=True,check=True)
          p.write_text(s);Path('.github/import-chunked-v128.yml').write_text(s)
          p=Path('scripts/test-original-retention.py');s=p.read_text();s+='\nimport yaml,subprocess\nparsed=yaml.safe_load(workflow)\ncleanup=parsed["jobs"]["import"]["steps"][-1]["run"]\nassert "scripts/retain-quality-originals.py" in cleanup\nsubprocess.run(["bash","-n"],input=cleanup,text=True,check=True)\nprint("Import workflow YAML and cleanup shell syntax validated.")\n';p.write_text(s)
          p=Path('.github/workflows/unit-evidence-tests.yml');s=p.read_text().replace('python-docx==1.2.0','python-docx==1.2.0 PyYAML==6.0.2');yaml.safe_load(s);Path('.github/unit-evidence-tests-v128.yml').write_text(s)
          PY
          python3 scripts/test-original-retention.py
          git diff --quiet -- index.html data task-unit-mappings.js upload-config.js
      - name: Commit ordinary source and validated staged workflows
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows/import-chunked.yml
          git add scripts/test-original-retention.py .github/import-chunked-v128.yml .github/unit-evidence-tests-v128.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: enforce YAML and shell validity for original-retention cleanup'
          git push origin HEAD:fix/retain-correction-originals-v1.2.8
