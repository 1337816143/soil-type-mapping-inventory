name: Prepare directory exceptions v126
on:
  push:
    branches: [fix/directory-exceptions-v1.2.6]
    paths: [.github/workflows/prepare-directory126.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply and validate source with immutable-directory guards
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          token=re.search(r'var tokenCodes = \[[^\]]+\]',Path('upload-config.js').read_text()).group()
          subprocess.run(['python3','.github/apply-directory126.py'],check=True)
          subprocess.run(['python3','.github/extend-directory-tests126.py'],check=True)
          subprocess.run(['node','scripts/bump-version.js','patch'],check=True)
          assert token==re.search(r'var tokenCodes = \[[^\]]+\]',Path('upload-config.js').read_text()).group()
          PY
          node --check admin-auto-classifier.js
          node --check admin-import-v2.js
          node --check page-enhancements-core.js
          node --check dashboard-extension.js
          node scripts/validate-project.js
          node scripts/validate-auto-import-classifier.js
          node scripts/validate-workspace.js
          git diff --quiet -- task-unit-mappings.js data assets replies work-records.js work-records-core.js
      - name: Export workflow blobs for the authorized repository connection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          paths=['.github/workflows/import-chunked.yml','.github/workflows/workspace-live-check.yml']
          results=[]
          for path in paths:
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':Path(path).read_text(),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as response:result=json.load(response)
              print('WORKFLOW_BLOB',path,result['sha'])
              results.append({'path':path,'sha':result['sha']})
          Path('test-artifacts/workflow-blobs.json').write_text(json.dumps(results,indent=2))
          PY
      - name: Commit ordinary source on the feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/directory-exceptions-v1.2.6'
          git restore --source=HEAD -- .github/workflows/import-chunked.yml .github/workflows/workspace-live-check.yml
          git rm .github/apply-directory126.py .github/extend-directory-tests126.py .github/directory126.part0
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: v1.2.6 directory-exception confirmation and red presentation'
          git push origin HEAD:fix/directory-exceptions-v1.2.6
          echo PREPARED_COMMIT=$(git rev-parse HEAD)
          echo PREPARED_TREE=$(git rev-parse HEAD^{tree})
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directory-preparation-results
          path: test-artifacts/
          retention-days: 3
