name: Test regional collection progress

on:
  push:
    branches: [fix-regional-progress-dashboard]
    paths:
      - '.github/workflows/test-regional-progress.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-regional-progress-dashboard
          fetch-depth: 0

      - name: Validate scripts, regions, municipal counts and markup
        shell: bash
        run: |
          set -euo pipefail
          node --check regional-progress-dashboard.js
          node --check task-unit-mappings.js
          node --check page-enhancements.js
          node --check upload-config.js
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/deploy.yml')"

          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');

          function extract(startText, endText) {
            const start = html.indexOf(startText);
            const end = html.indexOf(endText, start);
            if (start < 0 || end < 0) throw new Error(`无法定位：${startText}`);
            return html.slice(start, end);
          }

          const banner = {style:{display:''}, innerHTML:''};
          const styleIds = new Set();
          const document = {
            readyState:'complete',
            head:{appendChild(node){ if (node && node.id) styleIds.add(node.id); }},
            createElement(){ return {id:'', textContent:'', style:{}}; },
            getElementById(id){
              if (id === 'missingBanner') return banner;
              return styleIds.has(id) ? {id} : null;
            },
            querySelector(selector){
              if (selector === '.tab.active') return {getAttribute(){ return 'soilType'; }};
              return null;
            }
          };
          const context = {console, JSON, document, window:null};
          context.window = context;
          context.refreshAllTabs = function(){};
          vm.createContext(context);

          vm.runInContext(extract('var masterList = [', '// 从 tabData'), context);
          vm.runInContext(extract('function collectSubmittedDistricts', 'var soilTypeData = ['), context);
          vm.runInContext(extract('var soilTypeData = [', '\nvar soilAttrData = ['), context);
          context.tabData = {soilType: context.soilTypeData};

          vm.runInContext(fs.readFileSync('task-unit-mappings.js', 'utf8'), context);
          vm.runInContext(fs.readFileSync('regional-progress-dashboard.js', 'utf8'), context);

          const progress = context.SoilRegionalProgress.calculate('soilType');
          const south = progress.regions.south;
          const north = progress.regions.north;
          const southCities = progress.cities.filter(x => x.region === 'south');
          const northCities = progress.cities.filter(x => x.region === 'north');

          const expectedSouth = ['石家庄市','邢台市','沧州市','衡水市','邯郸市','辛集市'];
          const actualSouth = southCities.map(x => x.city);
          if (JSON.stringify(actualSouth) !== JSON.stringify(expectedSouth)) {
            throw new Error('南部片区城市不正确：' + JSON.stringify(actualSouth));
          }
          if (northCities.length !== 8) throw new Error('北部片区应为8个市区，实际为' + northCities.length);
          if (progress.cities.length !== 14) throw new Error('河北省整体应覆盖14个市区');
          const unique = new Set(progress.cities.map(x => x.city));
          if (unique.size !== 14) throw new Error('南北片区存在重复城市');

          if (south.expMunicipal !== 5) throw new Error('南部市级应有应为5，实际为' + south.expMunicipal);
          if (south.totalMunicipal !== 3) throw new Error('南部市级实际应为3，实际为' + south.totalMunicipal);
          if (south.expTasks !== 79) throw new Error('南部任务单元应有应为79，实际为' + south.expTasks);
          if (north.expTasks <= 0 || progress.overall.expTasks !== south.expTasks + north.expTasks) {
            throw new Error('河北省整体未正确汇总北部和南部');
          }

          const municipalMissing = southCities.flatMap(x => x.missing.filter(m => m.municipal).map(m => m.city));
          if (JSON.stringify(municipalMissing.sort()) !== JSON.stringify(['沧州市','邢台市'].sort())) {
            throw new Error('市级缺失应仅为邢台、沧州，实际为' + JSON.stringify(municipalMissing));
          }
          const sjz = southCities.find(x => x.city === '石家庄市');
          if (!sjz || sjz.expMunicipal !== 1 || sjz.totalMunicipal !== 1) {
            throw new Error('石家庄市级未正确计入1/1');
          }

          context.renderMissingBanner('soilType');
          const output = banner.innerHTML;
          if (!output.includes('河北省整体') || !output.includes('河北省北部片区') || !output.includes('河北省南部片区')) {
            throw new Error('整体、北部、南部标题不完整');
          }
          const detailsCount = (output.match(/<details class="regional-progress-section"/g) || []).length;
          if (detailsCount !== 2) throw new Error('应有2个片区折叠专栏');
          if (/<details[^>]*\sopen(?:\s|>)/.test(output)) throw new Error('片区明细默认不应展开');
          if (!output.includes('任务单元<br>应有') || !output.includes('任务单元<br>已收') ||
              !output.includes('任务单元<br>缺失') || !output.includes('市级进度<br>已收 / 应有')) {
            throw new Error('优化后的表头不完整');
          }
          if (output.indexOf('河北省北部片区') > output.indexOf('河北省南部片区')) {
            throw new Error('片区顺序应为北部在前、南部在后');
          }
          NODE

          python3 <<'PY'
          from pathlib import Path
          text = Path('page-enhancements.js').read_text(encoding='utf-8')
          core = text.index('page-enhancements-core.js')
          mapping = text.index('task-unit-mappings.js')
          regional = text.index('regional-progress-dashboard.js')
          dashboard = text.index('dashboard-extension.js')
          if not core < mapping < regional < dashboard:
              raise SystemExit('脚本加载顺序错误')
          PY

          grep -q 'page-enhancements.js?v=20260727-6' upload-config.js
          printf 'regional progress validation passed\n' > regional-progress-test-result.txt

      - name: Record validation result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regional-progress-test-result.txt
          git commit -m "test: record regional progress validation"
          git push origin HEAD:fix-regional-progress-dashboard
