name: Diagnose upload backend readiness
on:
  push:
    branches: [fix/managed-credential-ui-v1.2.13]
    paths: [.github/workflows/diagnose-upload-readiness.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check only whether required backend settings exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_UPLOAD_TOKEN: ${{ secrets.GITHUB_UPLOAD_TOKEN }}
          SOIL_ADMIN_PASSWORD: ${{ secrets.SOIL_ADMIN_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, json
          names = ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','GITHUB_UPLOAD_TOKEN','SOIL_ADMIN_PASSWORD']
          flags = {name: bool(os.environ.get(name, '').strip()) for name in names}
          print(json.dumps({'configured': flags, 'mode': 'presence-only; no values disclosed; no deployment or writes'}, ensure_ascii=False))
          PY
      - uses: actions/checkout@v4
        with:
          ref: 029487ff594c06283c2e4328cc4773b534bfdcad
          fetch-depth: 1
          sparse-checkout: |
            scripts/validate-embedded-token-live.js
            upload-config.js
          sparse-checkout-cone-mode: false
      - name: Run existing upload service credential health check
        timeout-minutes: 2
        run: node scripts/validate-embedded-token-live.js
