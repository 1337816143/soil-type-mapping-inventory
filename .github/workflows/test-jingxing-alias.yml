name: Test Jingxing combined task unit

on:
  push:
    branches: [fix-jingxing-mining-area-alias]
    paths:
      - '.github/workflows/test-jingxing-alias.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-jingxing-mining-area-alias
          fetch-depth: 0

      - name: Validate mapping and cache versions
        shell: bash
        run: |
          set -euo pipefail
          node --check task-unit-mappings.js
          node --check page-enhancements.js
          node --check upload-config.js

          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const index = fs.readFileSync('index.html', 'utf8');
          const match = index.match(/var masterList = (\[[\s\S]*?\n\]);\n\n\/\/ 从 tabData/);
          if (!match) throw new Error('无法读取现有 masterList');

          const context = {console, JSON, window: null, document: {readyState: 'complete'}};
          context.window = context;
          vm.createContext(context);
          vm.runInContext('masterList = ' + match[1], context);

          const cangzhou = context.masterList.find(x => x.city === '沧州市');
          if (!cangzhou.items.some(x => x.unit === '沧州华江工程勘察设计有限公司')) {
            cangzhou.items.push({unit:'沧州华江工程勘察设计有限公司', contact:'', phone:'', districts:['合并区']});
          }

          context.calculateDashboardStats = function () { return context.masterList; };
          context.renderMissingBanner = function () { return context.masterList; };
          vm.runInContext(fs.readFileSync('task-unit-mappings.js', 'utf8'), context);

          const soil = context.SoilTaskUnitLists.soilType;
          const sjz = soil.find(x => x.city === '石家庄市');
          const shengtu = sjz.items.find(x => x.unit === '河北盛图地理信息有限公司');
          if (!shengtu) throw new Error('找不到河北盛图对应项');
          if (shengtu.districts.length !== 4) throw new Error('河北盛图任务单元应为4个');
          if (!shengtu.districts.includes('井陉县（含矿区）')) throw new Error('未设置井陉县（含矿区）');
          if (shengtu.districts.includes('井陉县') || shengtu.districts.includes('井陉矿区')) {
            throw new Error('井陉县和井陉矿区仍被拆成两个任务单元');
          }

          function normalizeDistrictName(name) {
            return String(name || '')
              .replace(/\s+/g, '')
              .replace(/^\d{6}(?:[、,，]\d{6})*/, '')
              .replace(/[（(].*?[）)]/g, '')
              .replace(/(满族蒙古族自治县|蒙古族满族自治县|回族满族自治县|回族自治县|满族自治县|蒙古族自治县|自治县|县|区|市)$/, '');
          }
          if (normalizeDistrictName('井陉县（含矿区）') !== normalizeDistrictName('井陉县')) {
            throw new Error('井陉县不能匹配井陉县（含矿区）');
          }

          const selectedCities = ['石家庄市','邢台市','沧州市','衡水市','邯郸市','辛集市'];
          const counts = {};
          soil.forEach(city => counts[city.city] = city.items.reduce((sum, item) => sum + item.districts.length, 0));
          if (counts['石家庄市'] !== 16) throw new Error('石家庄应有数应为16，实际为' + counts['石家庄市']);
          const total = selectedCities.reduce((sum, city) => sum + counts[city], 0);
          if (total !== 78) throw new Error('当前统计范围应有数应为78，实际为' + total);
          NODE

          grep -q 'task-unit-mappings.js?v=20260727-2' page-enhancements.js
          grep -q 'page-enhancements.js?v=20260727-5' upload-config.js
          printf 'Jingxing combined task unit validation passed\n' > jingxing-alias-test-result.txt

      - name: Record validation result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jingxing-alias-test-result.txt
          git commit -m "test: record Jingxing alias validation"
          git push origin HEAD:fix-jingxing-mining-area-alias
