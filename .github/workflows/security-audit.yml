name: Frontend project audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check syntax, owner requirements and project rules
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 项目所有者明确要求默认 Token 内置在 upload-config.js。
          # 只禁止同类凭证意外出现在其他前端文件中。
          if grep -RInE --exclude='upload-config.js' --include='*.js' --include='*.html' --include='*.json' \
            '(github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,})' .; then
            echo '检测到 upload-config.js 之外的疑似 GitHub Token，停止检查。'
            exit 1
          fi

          grep -q 'var tokenCodes = \[' upload-config.js
          grep -q 'String.fromCharCode.apply(null, tokenCodes)' upload-config.js
          grep -q 'savedToken || window.SOIL_GITHUB_DEFAULT_UPLOAD_TOKEN' upload-config.js
          grep -q 'var defaultToken = String(window.SOIL_GITHUB_DEFAULT_UPLOAD_TOKEN' upload-token-default.js
          grep -q 'reply-workflow-core.js?v=' page-enhancements.js
          grep -q 'upload-success-notice.js?v=' page-enhancements.js
          grep -q '上传成功！稍等3~5分钟刷新网站即可查看新上传的文件。' upload-auth-reply-batch.js
          grep -q '上传成功！稍等3~5分钟刷新网站即可查看新上传的文件。' upload-success-notice.js
          grep -q '不得擅自删除、置空' MAINTENANCE_RULES.md

          node --check upload-config.js
          node --check page-enhancements.js
          node --check app-release-ui.js
          node --check app-version-guard.js
          node --check repository-manifest-loader.js
          node --check reply-workflow-core.js
          node --check upload-auth-reply-batch.js
          node --check upload-success-notice.js
          node --check upload-token-default.js
          node --check scripts/bump-version.js
          node --check scripts/validate-upload-token.js
          node --check scripts/validate-reply-workflow.js
          python3 -m py_compile scripts/build-repository-manifest.py
          python3 scripts/build-repository-manifest.py --output data/repository-tree.json
          node scripts/validate-upload-token.js
          node scripts/validate-reply-workflow.js
          node scripts/validate-project.js

          python3 <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/repository-tree.json').read_text(encoding='utf-8'))
          if payload.get('appVersion') != Path('VERSION').read_text(encoding='utf-8').strip():
              raise SystemExit('目录清单版本不一致')
          if not isinstance(payload.get('tree'), list):
              raise SystemExit('目录清单格式错误')
          PY

          echo '前端语法、上传流程、目录清单和项目规则检查通过。'
