name: Frontend project audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check syntax, owner requirements and project rules
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 项目所有者明确要求默认 Token 内置在 upload-config.js。
          # 只禁止同类凭证意外出现在其他前端文件中。
          if grep -RInE --exclude='upload-config.js' --include='*.js' --include='*.html' --include='*.json' \
            '(github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,})' .; then
            echo '检测到 upload-config.js 之外的疑似 GitHub Token，停止检查。'
            exit 1
          fi

          grep -q 'var tokenCodes = \[' upload-config.js
          grep -q 'String.fromCharCode.apply(null, tokenCodes)' upload-config.js
          grep -q 'savedToken || window.SOIL_GITHUB_DEFAULT_UPLOAD_TOKEN' upload-config.js
          grep -q 'installAtomicBootScreen' upload-config.js
          grep -q 'var defaultToken = String(window.SOIL_GITHUB_DEFAULT_UPLOAD_TOKEN' upload-token-default.js
          grep -q 'quality-file-routing.js?v=' page-enhancements.js
          grep -q 'north-quality-upload-adapter.js?v=' page-enhancements.js
          grep -q 'admin-upload-transport-fix.js?v=' page-enhancements.js
          grep -q 'hybrid-staged-upload.js?v=' page-enhancements.js
          grep -q 'reply-workflow-core.js?v=' page-enhancements.js
          grep -q 'reply-upload-progress.js?v=' page-enhancements.js
          grep -q 'upload-success-notice.js?v=' page-enhancements.js
          grep -q 'soil-app-booting' upload-config.js
          grep -q "xhr.upload.addEventListener('progress'" reply-upload-progress.js
          grep -q 'function normalizeStage(text)' admin-upload-transport-fix.js
          grep -q 'function renderUploadStatus()' admin-upload-transport-fix.js
          grep -q '上传进度：' admin-upload-transport-fix.js
          grep -q 'q.__soilAdminStatusInPlaceInstalled' admin-upload-transport-fix.js
          grep -q 'admin.__successNoticeProgressPatched' upload-success-notice.js
          grep -q "button.dataset.authReady = '1'" admin-upload-transport-fix.js
          grep -q "'Authorization': 'Bearer ' + token()" hybrid-staged-upload.js
          grep -q 'return fetch(API_ROOT + path' hybrid-staged-upload.js
          grep -q 'sharedStoragePath' hybrid-staged-upload.js
          grep -q 'dataKeys: shared.dataKeys.slice()' hybrid-staged-upload.js
          grep -q 'targets: shared.targets.slice()' hybrid-staged-upload.js
          grep -q "quality.get('shared')" .github/workflows/import-chunked.yml
          grep -q 'expandRecord(entry)' dashboard-extension.js
          grep -q '北部片区共享质控' MAINTENANCE_RULES.md
          grep -q 'documentCount' data/north-quality-feedback-package.json

          if grep -q 'window.fetch = function' admin-upload-transport-fix.js; then
            echo '管理员上传仍在全局替换 fetch，停止检查。'
            exit 1
          fi
          if grep -q 'new XMLHttpRequest()' admin-upload-transport-fix.js; then
            echo '管理员 Git Blob 上传仍被 XHR 接管，停止检查。'
            exit 1
          fi
          if grep -q 'new MutationObserver(armAdminUpload)' admin-upload-transport-fix.js; then
            echo '管理员进度脚本仍长期监听全页面并可能重复包裹，停止检查。'
            exit 1
          fi

          grep -q '上传成功！稍等3~5分钟刷新网站即可查看新上传的文件。' upload-auth-reply-batch.js
          grep -q '上传成功！稍等3~5分钟刷新网站即可查看新上传的文件。' upload-success-notice.js
          grep -q '不得擅自删除、置空' MAINTENANCE_RULES.md
          grep -q '原位置更新' MAINTENANCE_RULES.md
          grep -q '不得展示旧版基础页面' MAINTENANCE_RULES.md

          node --check upload-config.js
          node --check page-enhancements.js
          node --check app-release-ui.js
          node --check app-version-guard.js
          node --check repository-manifest-loader.js
          node --check quality-file-routing.js
          node --check north-quality-upload-adapter.js
          node --check hybrid-staged-upload.js
          node --check dashboard-extension.js
          node --check reply-workflow-core.js
          node --check reply-upload-progress.js
          node --check upload-auth-reply-batch.js
          node --check upload-success-notice.js
          node --check upload-token-default.js
          node --check admin-upload-transport-fix.js
          node --check scripts/bump-version.js
          node --check scripts/validate-upload-token.js
          node --check scripts/validate-reply-workflow.js
          node --check scripts/validate-reply-upload-progress.js
          node --check scripts/validate-app-boot.js
          node --check scripts/validate-admin-upload-transport.js
          node --check scripts/validate-admin-progress-wrapper.js
          node --check scripts/validate-north-quality-routing.js
          node --check scripts/validate-north-package-files.js
          node --check scripts/validate-north-shared-workflow.js
          node --check scripts/validate-embedded-token-live.js
          python3 -m py_compile scripts/build-repository-manifest.py
          python3 scripts/build-repository-manifest.py --output data/repository-tree.json
          node scripts/validate-upload-token.js
          node scripts/validate-reply-workflow.js
          node scripts/validate-reply-upload-progress.js
          node scripts/validate-app-boot.js
          node scripts/validate-admin-upload-transport.js
          node scripts/validate-admin-progress-wrapper.js
          node scripts/validate-north-quality-routing.js
          node scripts/validate-north-package-files.js
          node scripts/validate-north-shared-workflow.js
          node scripts/validate-project.js
          node scripts/validate-embedded-token-live.js

          python3 <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/repository-tree.json').read_text(encoding='utf-8'))
          if payload.get('appVersion') != Path('VERSION').read_text(encoding='utf-8').strip():
              raise SystemExit('目录清单版本不一致')
          if not isinstance(payload.get('tree'), list):
              raise SystemExit('目录清单格式错误')
          north = json.loads(Path('data/north-quality-feedback-package.json').read_text(encoding='utf-8'))
          if north.get('documentCount') != 28 or len(north.get('documents') or []) != 28:
              raise SystemExit('北部质控材料清单数量不正确')
          PY

          echo '前端语法、北部共享质控路由/文件包/完整工作流、管理员上传原位进度、递归防护、原始鉴权链路、在线 Token、整改答复、原子启动、目录清单和项目规则检查通过。'
