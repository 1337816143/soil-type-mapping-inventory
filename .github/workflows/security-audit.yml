name: Frontend security and project audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check credentials, syntax and project rules
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if grep -RInE --include='*.js' --include='*.html' --include='*.json' \
            '(github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,})' .; then
            echo '检测到疑似 GitHub Token，停止检查。'
            exit 1
          fi

          if grep -q 'var codes = \[' upload-config.js; then
            echo 'upload-config.js 仍包含编码形式的默认凭证。'
            exit 1
          fi

          grep -q "window.SOIL_GITHUB_DEFAULT_UPLOAD_TOKEN = '';" upload-config.js
          grep -q "sessionStorage.getItem(key)" upload-config.js
          grep -q "localStorage.removeItem(key)" upload-config.js
          grep -q "sessionStorage.setItem(TOKEN_KEY" upload-token-default.js
          grep -q "localStorage.removeItem(TOKEN_KEY)" upload-token-default.js
          grep -q "remember.checked = false" upload-token-default.js
          grep -q "role', 'tab'" upload-token-default.js
          grep -q "noopener noreferrer" upload-token-default.js
          grep -q "./data/repository-tree.json" repository-manifest-loader.js

          node --check upload-config.js
          node --check page-enhancements.js
          node --check app-release-ui.js
          node --check app-version-guard.js
          node --check repository-manifest-loader.js
          node --check upload-token-default.js
          node --check scripts/bump-version.js
          python3 -m py_compile scripts/build-repository-manifest.py
          python3 scripts/build-repository-manifest.py --output data/repository-tree.json
          node scripts/validate-project.js

          python3 <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/repository-tree.json').read_text(encoding='utf-8'))
          if payload.get('appVersion') != Path('VERSION').read_text(encoding='utf-8').strip():
              raise SystemExit('目录清单版本不一致')
          if not isinstance(payload.get('tree'), list):
              raise SystemExit('目录清单格式错误')
          PY

          echo '前端安全、目录清单和项目规则检查通过。'
