name: Prepare verified unit repair v127
on:
  push:
    branches: [fix/evidence-unit-repair-v1.2.7]
    paths: [.github/workflows/prepare-unit-repair-v127.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document inspection dependencies
        run: python -m pip install PyMuPDF==1.26.4 lxml==6.0.1 numpy==2.2.6 Pillow==11.3.0 python-docx==1.2.0
      - name: Integrate source and validate isolated PDF and Word fixtures
        run: |
          set -euo pipefail
          python .github/apply-unit-repair.py
          mkdir -p test-artifacts
          node --check admin-auto-classifier.js
          node --check page-enhancements-core.js
          node --check upload-auth-reply-batch.js
          node scripts/validate-auto-import-classifier.js
          node scripts/validate-project.js
          node scripts/validate-reply-workflow.js
          node scripts/validate-workspace.js
          python scripts/test-unit-correction.py
      - name: Reconcile mounted originals only with page-level verification
        run: |
          set -euo pipefail
          python scripts/repair-quality-units.py --mode migrate --qa-dir test-artifacts/actual-report-pages
          python scripts/verify-unit-repair.py
          node scripts/validate-auto-import-classifier.js
          node scripts/validate-project.js
          node scripts/validate-workspace.js
          git diff --quiet -- task-unit-mappings.js data/north-quality-feedback-package.json replies assets work-records.js work-records-core.js data/work-records.json
          python - <<'PY'
          import json,subprocess,re
          from pathlib import Path
          report=json.loads(Path('docs/unit-repair-v1.2.7.json').read_text())
          expected={x['path'] for x in report['reports'] if x['documentChanged']}
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          actual={x for x in changed if x.endswith(('.pdf','.docx','.doc'))}
          assert actual==expected,(actual,expected)
          before=subprocess.check_output(['git','show','HEAD:index.html']).decode()
          after=Path('index.html').read_text()
          assert re.search(r'var masterList = \[[\s\S]*?\n\];',before).group()==re.search(r'var masterList = \[[\s\S]*?\n\];',after).group()
          before_token=re.search(r'var tokenCodes = \[[^\]]+\]',subprocess.check_output(['git','show','HEAD:upload-config.js']).decode()).group()
          assert before_token==re.search(r'var tokenCodes = \[[^\]]+\]',Path('upload-config.js').read_text()).group()
          print('Only audited mounted PDF files changed; directory, credential and prior replies unchanged')
          PY
      - name: Commit ordinary source and corrected reports on feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/evidence-unit-repair-v1.2.7'
          git restore --source=HEAD -- .github/workflows/import-chunked.yml
          git rm .github/apply-unit-repair.py .github/unit-evidence-insert.js .github/unit-repair-patch-0.txt
          git add -u
          git add .github/import-chunked-v127.yml docs/unit-repair-v1.2.7.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: v1.2.7 evidence-backed report and platform company corrections'
          git push origin HEAD:fix/evidence-unit-repair-v1.2.7
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-repair-evidence-results
          path: |
            test-artifacts/
            docs/unit-repair-v1.2.7.json
          retention-days: 5
