name: Prepare UI review v123
on:
  push:
    branches: [feat/liquid-navigation-v1.2.3]
    paths: [.github/workflows/prepare-ui-v123.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded presentation changes
        run: |
          set -euo pipefail
          python .github/apply-ui-v123.py
          python -m pip install Pillow==11.3.0
          python scripts/build-transparent-logo.py
          node --check glass-navigation.js
          node scripts/validate-project.js
          node scripts/validate-workspace.js
          git diff --quiet -- assets/logo.jpg data work-records.js work-records-core.js batch-policy.js batch-management.js replies
      - name: Commit only the feature branch and remove preparation files
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/liquid-navigation-v1.2.3'
          git rm .github/apply-ui-v123.py .github/ui-polish.css .github/ui-v123.patch.b64 .github/workflows/prepare-ui-v123.yml
          git add -u
          git add assets/cau-logo-transparent.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate v1.2.3 glass navigation and transparent CAU footer'
          git push origin HEAD:feat/liquid-navigation-v1.2.3
          git rev-parse HEAD
