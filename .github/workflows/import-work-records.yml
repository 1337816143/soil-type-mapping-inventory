name: Save work records and attachments
on:
  push:
    branches: ['work-records-upload-*']
    paths: ['.work-records-upload/ready.json']
permissions:
  contents: write
  actions: write
concurrency:
  group: work-record-${{ github.ref }}
  cancel-in-progress: false
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate and reconstruct isolated attachments
        run: python3 scripts/work-records-store.py prepare --out "$RUNNER_TEMP/work-record-operation"
      - name: Save without overwriting concurrent edits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            python3 scripts/work-records-store.py apply --out "$RUNNER_TEMP/work-record-operation"
            git add -- data/work-records
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'docs: save work record and attachments'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo '仓库持续更新，请保留草稿并重试。'
          exit 1
      - name: Publish updated site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" -f ref=main
      - name: Remove completed staging branch
        if: success()
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: git push origin --delete "$SOURCE_BRANCH"
