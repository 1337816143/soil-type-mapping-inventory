name: Upload source diagnostics
on:
  push:
    branches: [fix/upload-auth-v1.2.12]
    paths: [.github/workflows/upload-diagnostics.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Export source without credentials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re,zipfile
          with zipfile.ZipFile('/tmp/upload-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  p=Path(name)
                  if not p.is_file(): continue
                  if name.startswith('assets/'):
                      z.write(p,name);continue
                  if p.suffix not in {'.js','.css','.html','.json','.py','.yml','.md'} and name!='VERSION':continue
                  text=p.read_text(encoding='utf-8')
                  if name=='upload-config.js':
                      fake=','.join(str(ord(c)) for c in 'github_pat_'+'x'*82)
                      text=re.sub(r'var tokenCodes = \[[^\]]+\]', 'var tokenCodes = ['+fake+']', text)
                  text=re.sub(r'github_pat_[A-Za-z0-9_]{30,}|ghp_[A-Za-z0-9]{20,}','REDACTED_CREDENTIAL',text)
                  z.writestr(name,text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: upload-source
          path: /tmp/upload-source.zip
          retention-days: 1
