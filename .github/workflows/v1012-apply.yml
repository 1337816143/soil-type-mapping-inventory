name: Temporary v1.0.12 patch applicator

on:
  push:
    branches:
      - feat/auto-import-association-v1.0.12

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/auto-import-association-v1.0.12
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 scripts/v1012-apply.py
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hybrid-staged-upload.js .github/workflows/import-chunked.yml data/north-quality-feedback-package.json scripts/bump-version.js
          if git diff --cached --quiet; then
            echo 'No structural patch changes.'
          else
            git commit -m "build: apply v1.0.12 structural patch"
            git push origin HEAD:feat/auto-import-association-v1.0.12
          fi
