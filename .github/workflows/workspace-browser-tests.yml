name: Workspace browser regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Run data and concurrency tests
        run: node scripts/validate-workspace.js
      - name: Test workspace in Chromium and WebKit
        env:
          BROWSER_ENGINES: chromium,webkit
        run: python scripts/test-workspace-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-results
          path: test-artifacts/
          retention-days: 5
