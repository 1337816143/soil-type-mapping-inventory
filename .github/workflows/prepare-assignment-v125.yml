name: Prepare assignment matching v125
on:
  push:
    branches: [fix/result-specific-company-v1.2.5]
    paths: [.github/workflows/prepare-assignment-v125.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply bounded patch and bump version
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib, subprocess, re
          assert Path('VERSION').read_text().strip()=='v1.2.4', 'Unexpected release baseline'
          old_index=Path('index.html').read_text()
          old_list=re.search(r'var masterList = \[[\s\S]*?\n\];', old_index).group()
          old_mapping=Path('task-unit-mappings.js').read_bytes()
          old_token=re.search(r'var tokenCodes = \[[^\]]+\]',Path('upload-config.js').read_text()).group()
          protected=['data/admin-import-index.json','data/north-quality-feedback-package.json','data/work-records.json']
          original={p:Path(p).read_bytes() for p in protected}
          encoded=''.join(Path(f'.github/assignment125/part{i}.b64').read_text().strip() for i in range(1,5))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==82236
          assert hashlib.sha256(patch).hexdigest()=='20ccceba3e327283efff09bc810c087b0fc6e30dbb1dd3373d5988c76e468648', 'Patch checksum mismatch'
          Path('/tmp/assignment125.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/assignment125.patch'],check=True)
          subprocess.run(['git','apply','/tmp/assignment125.patch'],check=True)
          subprocess.run(['node','scripts/bump-version.js','patch'],check=True)
          p=Path('CHANGELOG.md')
          p.write_text(p.read_text().replace('# Changelog\n', '''# Changelog

          ## v1.2.5 — 2026-09-22

          - 质控归属按每个成果类型独立查询对应地区的作业单位；修复将土壤类型图清单与其他成果清单混查造成的“任务单元仍不唯一”误报。
          - 文件名中的明确公司全称优先用于本次归档；未写公司则按该成果类型与地区的原清单匹配。与清单不同时显示两者及来源，不修改清单；多个不同公司或未知地区分别说明具体原因。
          - 一份多成果或多地区文件保留独立的成果—地区—作业单位关联，预览与最终导入索引一致；物理原文件仍只保存一次。
          - 人工调整使用该文件的成果类型清单，修复下拉选项值，人工选定归属不会被自动刷新覆盖，支持恢复自动识别。
          - 新增实际内嵌清单逐项匹配、原始清单字节保护、公司优先/多成果/共享报告、真实导入索引写入及上传预览浏览器回归。原北部28份权威索引、数据、附件和凭证不变。
          '''.replace('\n          ','\n'),1))
          p=Path('MAINTENANCE_RULES.md')
          p.write_text(p.read_text()+'''

          ## v1.2.5 质控归属识别约束

          - 原 masterList 与 task-unit-mappings.js 清单只读，不得因文件名指定单位而修改。
          - 文件名明确公司优先于本次导入的清单默认单位；没有公司时只能按该成果类型与地区匹配，不混查其他成果清单。
          - 多成果报告的每类成果独立保留单位归属；预览、暂存清单与导入索引必须一致。
          - 多个不同公司、缺失地区、同名地区或清单缺失必须分别解释，不统一报“任务单元不唯一”。
          '''.replace('\n          ','\n'))
          assert re.search(r'var masterList = \[[\s\S]*?\n\];',Path('index.html').read_text()).group()==old_list
          assert Path('task-unit-mappings.js').read_bytes()==old_mapping
          assert re.search(r'var tokenCodes = \[[^\]]+\]',Path('upload-config.js').read_text()).group()==old_token
          assert all(Path(p).read_bytes()==original[p] for p in protected)
          print('Original embedded lists, stored indexes and credential bytes unchanged.')
          PY
          node --check admin-auto-classifier.js
          node --check admin-import-v2.js
          node --check admin-import-v2-bridge.js
          node --check hybrid-staged-upload.js
          node --check north-quality-upload-adapter.js
          node --check north-quality-authority-bridge.js
          node scripts/validate-auto-import-classifier.js
          node scripts/validate-project.js
          node scripts/validate-workspace.js
          node scripts/validate-reference-upload-isolation.js
          node scripts/validate-north-shared-workflow.js
          node scripts/validate-north-authority.js
      - name: Commit ordinary source files on the feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/result-specific-company-v1.2.5'
          git diff --quiet -- task-unit-mappings.js data replies reference-files assets .github/workflows
          git rm -r .github/assignment125
          git add -u
          git add scripts/validate-assignment-matching.js scripts/test-assignment-index.py scripts/check-assignment-ui.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: v1.2.5 type-specific company matching with immutable task lists'
          git push origin HEAD:fix/result-specific-company-v1.2.5
          git rev-parse HEAD
