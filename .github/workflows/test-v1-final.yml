name: Test final v1.0.0 release

on:
  push:
    branches: [release-v1.0.0-ui-data-quality]
    paths:
      - '.github/workflows/test-v1-final.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v1.0.0-ui-data-quality
          fetch-depth: 0

      - run: npm install --no-save --no-package-lock jsdom@24

      - name: Validate permanent checks and city badges
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-project.js
          node --check app-release-ui.js
          node --check regional-progress-dashboard.js
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/deploy.yml')"

          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const {JSDOM} = require('jsdom');
          const dom = new JSDOM(`<!doctype html><html><head></head><body>
            <header><h1 class="page-title-with-logo"><img class="page-title-logo">测试平台</h1></header>
            <div id="ref-root"><details class="ref-cat" open><summary>土壤类型图</summary></details></div>
            <footer><div class="container"></div></footer>
          </body></html>`, {runScripts:'outside-only'});
          const window = dom.window;
          const context = dom.getInternalVMContext();
          Object.defineProperty(window.document, 'readyState', {value:'complete', configurable:true});
          window.SoilRegionalProgress = {
            unitKeys(name) {
              return String(name || '').split(/\s*\/\s*/).map(x => x.replace(/\s+/g, '')).filter(Boolean);
            },
            refresh() {}
          };
          window.renderCities = function () {
            return '<section class="city-section"><h2>测试市 <span class="badge">4 家单位 · 4 成果</span></h2></section>';
          };

          vm.runInContext(fs.readFileSync('app-release-ui.js', 'utf8'), context);
          const output = window.renderCities([{name:'测试市', units:[
            {name:'单位甲'}, {name:'单位甲'}, {name:'单位乙 / 单位丙'}
          ]}], 'soilType');
          if (!output.includes('3 家单位（去重）')) throw new Error('城市单位徽标去重失败：' + output);
          if (!window.document.querySelector('.page-title-logo-frame')) throw new Error('Logo裁切容器缺失');
          if (!window.document.querySelector('.app-version-badge')) throw new Error('版本徽标缺失');
          if (window.document.querySelector('.ref-cat').open) throw new Error('参考分组未默认收起');

          fs.writeFileSync('v1-final-validation.txt', 'final v1.0.0 validation passed\n');
          NODE

      - name: Record validation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1-final-validation.txt
          git commit -m "test: record final v1.0.0 validation"
          git push origin HEAD:release-v1.0.0-ui-data-quality
