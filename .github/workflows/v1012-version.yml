name: Temporary v1.0.12 loader version patch

on:
  push:
    branches:
      - feat/auto-import-association-v1.0.12

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/auto-import-association-v1.0.12
          fetch-depth: 0
      - name: Patch only version strings
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('upload-config.js')
          text = path.read_text(encoding='utf-8')
          before = text
          text = text.replace("window.SOIL_RELEASE_VERSION = 'v1.0.11';", "window.SOIL_RELEASE_VERSION = 'v1.0.12';", 1)
          text = text.replace("window.SOIL_APP_VERSION = 'v1.0.11';", "window.SOIL_APP_VERSION = 'v1.0.12';", 1)
          text = text.replace("page-enhancements.js?v=1.0.11", "page-enhancements.js?v=1.0.12", 1)
          if text == before:
              raise SystemExit('upload-config.js version anchors were not changed')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit loader version only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upload-config.js
          git commit -m "release: align loader with v1.0.12"
          git push origin HEAD:feat/auto-import-association-v1.0.12
