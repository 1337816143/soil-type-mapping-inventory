name: Prepare merged-directory v129
on:
  push:
    branches: [fix/merged-directory-v1.2.9]
    paths: [.github/workflows/prepare-merged-v129.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply and verify bounded source edits
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,runpy,hashlib,subprocess
          token=re.search(r'var tokenCodes = \[[^\]]+\]',Path('upload-config.js').read_text()).group()
          runpy.run_path('.github/apply-merged-v129.py',run_name='__main__')
          assert token==re.search(r'var tokenCodes = \[[^\]]+\]',Path('upload-config.js').read_text()).group()
          expected={'admin-auto-classifier.js':'d29b88e1c26c816da27cf2345e0b9955ce95658af6c4246725d15966f05e4a02','page-enhancements-core.js':'a1789e2acef2f7cc4341510aea2761812a1472b99a976a0cb2700b364ae578da','scripts/test-live-workspace.py':'79f7205c1b30453b9cff7d407c8eed0a8651f0dfc06a887d839f2c3a05fb3660','scripts/test-workspace-browser.py':'72e100f741e5555d93f514ba6da350116541020eb5e58849994338550afd509b'}
          for path,checksum in expected.items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==checksum,path
          allowed={'CHANGELOG.md','MAINTENANCE_RULES.md','VERSION','admin-auto-classifier.js','admin-import-v2.js','app-release-ui.js','app-version-guard.js','chunked-staged-upload.js','docs/QUALITY_UPLOAD_NAMING.md','hybrid-staged-upload.js','index.html','page-enhancements-core.js','page-enhancements.js','scripts/test-live-workspace.py','scripts/test-workspace-browser.py','scripts/validate-auto-import-classifier.js','upload-config.js'}
          changed=set(subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0'))-{''}
          assert changed<=allowed,changed-allowed
          print('Local-tested checksums verified; original rosters and credentials unchanged')
          PY
          node --check admin-auto-classifier.js
          node --check page-enhancements-core.js
          node --check admin-import-v2.js
          node --check hybrid-staged-upload.js
          node --check chunked-staged-upload.js
          node scripts/validate-project.js
          node scripts/validate-auto-import-classifier.js
          node scripts/validate-workspace.js
          git diff --quiet -- task-unit-mappings.js data replies assets work-records.js work-records-core.js
      - name: Commit feature source only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/merged-directory-v1.2.9'
          git rm .github/apply-merged-v129.py
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: v1.2.9 evidence-based merged districts and accurate discrepancy notes'
          git push origin HEAD:fix/merged-directory-v1.2.9
