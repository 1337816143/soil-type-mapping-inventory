name: Prepare aligned gutters v124
on:
  push:
    branches: [fix/aligned-page-gutters-v1.2.4]
    paths: [.github/workflows/prepare-gutters-v124.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Align page shell without modifying business modules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          assert Path('VERSION').read_text().strip() == 'v1.2.3', 'Unexpected baseline'
          token_pattern = r'var tokenCodes = \[[^\]]+\]'
          before = re.search(token_pattern, Path('upload-config.js').read_text()).group()
          css = Path('glass-interface.css')
          css.write_text(css.read_text() + '''
          /* Shared outer gutter: match the existing header, not its inner padding.
             Scope to the page shell so modal widths, table columns and nested
             containers retain their existing behavior. */
          html.glass-ui{--page-inline-gutter:12px}
          html.glass-ui body>header{margin-inline:var(--page-inline-gutter)}
          html.glass-ui body>.container{box-sizing:border-box;min-width:0;padding-inline:var(--page-inline-gutter)!important}
          html.glass-ui body>footer{margin-inline:var(--page-inline-gutter);padding-inline:0}
          @media(max-width:760px){html.glass-ui{--page-inline-gutter:6px}}
          ''')
          test = Path('scripts/glass-ui-checks.py')
          source = test.read_text()
          needle = "    return {'status':'passed','tabs':keys,"
          assert needle in source
          source = source.replace(needle, "    gutters = check_page_gutters(page, out, prefix)\n    return {'status':'passed','pageGutters':gutters,'tabs':keys,", 1)
          source += '''
          
          def check_page_gutters(page, out, prefix):
              """Compare actual outer edges for every tab, including the breakpoint."""
              widths = [320, 360, 390, 430, 760, 761, 1024, 1440, 1920]
              keys = page.locator('header .tabs .tab').evaluate_all('(ns)=>ns.map(n=>n.dataset.tab)')
              results = []
              for width in widths:
                  page.set_viewport_size({'width':width, 'height':1000 if width >= 1024 else 844})
                  for key in keys:
                      page.locator('[data-tab="'+key+'"]').click()
                      page.wait_for_timeout(240)
                      geometry = page.evaluate("""()=>{
                        const rect=n=>{const r=n.getBoundingClientRect();return {left:r.left,right:r.right};};
                        const header=rect(document.querySelector('body>header'));
                        const main=document.querySelector('body>.container'), m=rect(main), s=getComputedStyle(main);
                        const panel=rect(main.querySelector('.tab-content.active'));
                        const surfaces=Array.from(main.querySelectorAll('#missingBanner,.tab-content.active .city-section .table-wrap,.tab-content.active .wr-page'))
                          .filter(n=>n.getClientRects().length&&getComputedStyle(n).display!=='none').map(rect);
                        return {header,content:{left:m.left+parseFloat(s.paddingLeft),right:m.right-parseFloat(s.paddingRight)},
                          panel,footer:rect(document.querySelector('body>footer')),surfaces,viewport:document.documentElement.clientWidth};
                      }""")
                      h = geometry['header']
                      expected = 6 if width <= 760 else 12
                      assert abs(h['left']-expected)<1 and abs(geometry['viewport']-h['right']-expected)<1, ('header changed',width,key,geometry)
                      for name in ['content','panel','footer']:
                          r = geometry[name]
                          assert abs(r['left']-h['left'])<1 and abs(r['right']-h['right'])<1, (name,width,key,geometry)
                      for r in geometry['surfaces']:
                          assert abs(r['left']-h['left'])<1 and abs(r['right']-h['right'])<1, ('surface alignment',width,key,r,h)
                      results.append({'width':width,'tab':key,'left':h['left'],'rightGutter':geometry['viewport']-h['right']})
                      if (width==1440 and key in ['soilType','references','workRecords']) or (width==390 and key=='soilType'):
                          page.evaluate('window.scrollTo(0,0)')
                          page.screenshot(path=str(out/(prefix+'-gutters-'+key+'-'+str(width)+'.png')))
              page.set_viewport_size({'width':1440,'height':1000})
              page.locator('[data-tab="soilType"]').click()
              page.evaluate('window.scrollTo(0,0)')
              return {'status':'passed','widths':widths,'tabCount':len(keys),'measurements':results}
          '''
          # Dedent the appended function to module scope; the workflow heredoc
          # itself already has no indentation after YAML block processing.
          import textwrap
          cut = source.index('\n          \n          def check_page_gutters') if '\n          \n          def check_page_gutters' in source else -1
          if cut >= 0:
              source = source[:cut] + '\n\n' + textwrap.dedent(source[cut:]).lstrip('\n')
          test.write_text(source)
          compile(source, str(test), 'exec')
          log = Path('CHANGELOG.md')
          log.write_text(log.read_text().replace('# Changelog\n', '# Changelog\n\n## v1.2.4 — 2026-09-21\n\n- 主体左右留白统一与顶部外框对齐，覆盖进度区、全部成果表格、参考文件、工作记录和页脚；保留原顶部尺寸。\n- 页面外层共享响应式边距：桌面12px、760px及以下6px；不全局重写容器，不改表格列宽、弹窗与内部组件间距。\n- 新增9种宽度×9个标签的真实几何边界检查，同时纳入 Chromium/WebKit 和线上只读回归；保留全部已有检查。\n- 业务数据、附件、上传/答复/工作记录逻辑及内置凭证字节保持不变。\n', 1))
          rules = Path('MAINTENANCE_RULES.md')
          rules.write_text(rules.read_text()+'\n## v1.2.4 页面边界\n\n- 主体进度区、各标签内容和页脚的外边界与顶部玻璃外框对齐，统一使用响应式外层边距；不得再用全局容器样式将内容贴到屏幕边缘。\n- 外层留白调整不得改动表格列结构、弹窗可视区域与原有业务流程。\n')
          subprocess.run(['node','scripts/bump-version.js','patch'],check=True)
          assert before == re.search(token_pattern, Path('upload-config.js').read_text()).group(), 'Credential changed'
          allowed = {'glass-interface.css','scripts/glass-ui-checks.py','CHANGELOG.md','MAINTENANCE_RULES.md','VERSION','upload-config.js','app-release-ui.js','app-version-guard.js','page-enhancements.js','index.html'}
          changed = set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          assert changed <= allowed, changed-allowed
          print('Presentation-only changes verified; existing data and credentials preserved')
          PY
          node scripts/validate-project.js
          node scripts/validate-workspace.js
      - name: Commit only prepared source files on the feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/aligned-page-gutters-v1.2.4'
          git add glass-interface.css scripts/glass-ui-checks.py CHANGELOG.md MAINTENANCE_RULES.md VERSION upload-config.js app-release-ui.js app-version-guard.js page-enhancements.js index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: v1.2.4 align all page content gutters with header'
          git push origin HEAD:fix/aligned-page-gutters-v1.2.4
