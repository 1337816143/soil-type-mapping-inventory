name: Import staged Release files

on:
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: soil-staged-import
  cancel-in-progress: false

jobs:
  import:
    if: startsWith(github.event.release.tag_name, 'soil-import-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download staged assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p .staged-release
          gh release download "$RELEASE_TAG" --dir .staged-release
          test -f .staged-release/soil-import-manifest.json

      - name: Validate and restore repository paths
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          stage = root / '.staged-release'
          manifest_path = stage / 'soil-import-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          if manifest.get('schemaVersion') != 1:
              raise SystemExit('不支持的导入清单版本')

          kind = manifest.get('kind')
          if kind not in {'reference', 'quality'}:
              raise SystemExit('导入类型无效')

          reference_root = str(manifest.get('referenceRoot') or 'reference-files/third-soil-survey').strip('/')
          index_path = str(manifest.get('indexPath') or 'data/admin-import-index.json').strip('/')
          files = manifest.get('files')
          if not isinstance(files, list) or not files:
              raise SystemExit('导入清单中没有文件')

          assigned = set()
          quality_records = []

          def safe_target(raw):
              value = str(raw or '').replace('\\', '/').strip('/')
              path = PurePosixPath(value)
              if not value or path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'非法目标路径：{raw}')
              if kind == 'reference':
                  if value != reference_root and not value.startswith(reference_root + '/'):
                      raise SystemExit(f'参考资料越界：{value}')
              else:
                  if not value.startswith('data/质控意见反馈_管理员导入/'):
                      raise SystemExit(f'质控意见越界：{value}')
              return value

          def unique_path(value):
              target = root / value
              if value not in assigned and not target.exists():
                  assigned.add(value)
                  return value
              posix = PurePosixPath(value)
              parent = '' if str(posix.parent) == '.' else str(posix.parent) + '/'
              suffix = ''.join(posix.suffixes)
              name = posix.name[:-len(suffix)] if suffix else posix.name
              number = 2
              while True:
                  candidate = f'{parent}{name}_第{number}份{suffix}'
                  if candidate not in assigned and not (root / candidate).exists():
                      assigned.add(candidate)
                      return candidate
                  number += 1

          for item in sorted(files, key=lambda x: int(x.get('order') or 0)):
              asset_name = str(item.get('assetName') or '')
              source = stage / asset_name
              if not asset_name or '/' in asset_name or '\\' in asset_name or not source.is_file():
                  raise SystemExit(f'找不到暂存文件：{asset_name}')

              expected_size = int(item.get('size') or -1)
              actual_size = source.stat().st_size
              if expected_size >= 0 and actual_size != expected_size:
                  raise SystemExit(f'文件大小校验失败：{asset_name}')
              if actual_size >= 100 * 1024 * 1024:
                  raise SystemExit(f'普通 Git 仓库不接受 100 MB 及以上文件：{asset_name}')

              expected_hash = str(item.get('sha256') or '').lower()
              if expected_hash:
                  digest = hashlib.sha256()
                  with source.open('rb') as handle:
                      for block in iter(lambda: handle.read(1024 * 1024), b''):
                          digest.update(block)
                  if digest.hexdigest() != expected_hash:
                      raise SystemExit(f'SHA-256 校验失败：{asset_name}')

              requested = safe_target(item.get('targetPath'))
              final_path = unique_path(requested)
              destination = root / final_path
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)

              quality = item.get('quality')
              if kind == 'quality' and isinstance(quality, dict):
                  quality_records.append({
                      'kind': 'quality-control',
                      'dataKey': str(quality.get('dataKey') or ''),
                      'city': str(quality.get('city') or ''),
                      'unit': str(quality.get('unit') or ''),
                      'district': str(quality.get('district') or ''),
                      'batch': str(quality.get('batch') or '管理员导入'),
                      'path': final_path,
                      'name': PurePosixPath(final_path).name,
                      'sourcePath': str(item.get('sourcePath') or ''),
                      'order': int(item.get('order') or 0),
                      'complete': bool(quality.get('complete')),
                      'uploadedAt': str(manifest.get('createdAt') or '')
                  })

          if kind == 'quality':
              target_index = root / index_path
              target_index.parent.mkdir(parents=True, exist_ok=True)
              try:
                  current = json.loads(target_index.read_text(encoding='utf-8')) if target_index.exists() else []
              except Exception:
                  current = []
              if not isinstance(current, list):
                  current = []
              incoming_paths = {entry['path'] for entry in quality_records}
              merged = [entry for entry in current if isinstance(entry, dict) and entry.get('path') not in incoming_paths]
              merged.extend(quality_records)
              target_index.write_text(json.dumps(merged, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          shutil.rmtree(stage)
          PY

      - name: Commit all imported files once
        env:
          IMPORT_ID: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "没有需要提交的文件。"
          else
            git commit -m "docs: import staged files ${IMPORT_ID#soil-import-}"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload updated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Remove temporary Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
