name: Test task mappings and reference banner

on:
  push:
    branches: [fix-reference-banner-and-task-mappings]
    paths:
      - '.github/workflows/test-task-mappings.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-reference-banner-and-task-mappings
          fetch-depth: 0

      - name: Validate scripts and mapping behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check task-unit-mappings.js
          node --check dashboard-extension.js
          node --check reference-library.js
          node --check page-enhancements.js
          node --check upload-config.js
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/deploy.yml')"

          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const index = fs.readFileSync('index.html', 'utf8');
          const match = index.match(/var masterList = (\[[\s\S]*?\n\]);\n\n\/\/ 从 tabData/);
          if (!match) throw new Error('无法读取 index.html 中的现有 masterList');

          const context = {
            console,
            JSON,
            window: null,
            document: {readyState: 'complete'}
          };
          context.window = context;
          vm.createContext(context);
          vm.runInContext('masterList = ' + match[1], context);

          // 复现 page-enhancements-core.js 中此前已经存在的沧州合并区修正。
          const cangzhou = context.masterList.find(x => x.city === '沧州市');
          if (!cangzhou.items.some(x => x.unit === '沧州华江工程勘察设计有限公司')) {
            cangzhou.items.push({unit:'沧州华江工程勘察设计有限公司', contact:'', phone:'', districts:['合并区']});
          }

          context.calculateDashboardStats = function () { return context.masterList; };
          context.renderMissingBanner = function () { return context.masterList; };
          vm.runInContext(fs.readFileSync('task-unit-mappings.js', 'utf8'), context);

          const lists = context.SoilTaskUnitLists;
          if (!lists || !lists.soilType || !lists.other) throw new Error('两套清单未生成');

          const counts = {};
          lists.soilType.forEach(c => counts[c.city] = c.items.reduce((sum, x) => sum + x.districts.length, 0));
          const expected = {
            '石家庄市': 17,
            '邢台市': 19,
            '沧州市': 15,
            '衡水市': 12,
            '邯郸市': 15,
            '辛集市': 1
          };
          for (const [name, value] of Object.entries(expected)) {
            if (counts[name] !== value) throw new Error(`${name} 应为 ${value}，实际 ${counts[name]}`);
          }
          const total = Object.values(expected).reduce((a, b) => a + b, 0);
          if (total !== 79) throw new Error('统计范围合计不是79');

          const sjz = lists.soilType.find(x => x.city === '石家庄市');
          if (!sjz.items.some(x => x.unit === '中地科勘察设计有限公司' && x.districts.includes('新乐市'))) {
            throw new Error('土壤类型图石家庄清单1未生效');
          }
          const xingtai = lists.soilType.find(x => x.city === '邢台市');
          if (!xingtai.items.some(x => x.unit === '天津华勘检验测试有限公司' && x.districts.includes('邢台市'))) {
            throw new Error('土壤类型图邢台清单1未生效');
          }
          const soilCangzhou = lists.soilType.find(x => x.city === '沧州市');
          const huajiang = soilCangzhou.items.find(x => x.unit === '沧州华江工程勘察设计有限公司');
          if (!huajiang || !huajiang.districts.includes('合并区') || !huajiang.districts.includes('青县')) {
            throw new Error('土壤类型图未保留沧州合并区修正');
          }

          const otherCangzhou = lists.other.find(x => x.city === '沧州市');
          if (!otherCangzhou.items.some(x => x.unit === '沧州华江工程勘察设计有限公司' && x.districts.includes('合并区'))) {
            throw new Error('其他成果未保留此前沧州合并区修正');
          }
          const xiongan = lists.other.find(x => x.city === '雄安新区');
          if (!xiongan.items.some(x => x.unit === '北京世纪国源科技股份有限公司' && x.districts.includes('雄县'))) {
            throw new Error('清单2雄安新区单位名称未校正');
          }

          const soilSelected = context.calculateDashboardStats('soilType');
          const otherSelected = context.calculateDashboardStats('soilAttr');
          if (soilSelected !== lists.soilType) throw new Error('土壤类型图未切换到清单1');
          if (otherSelected !== lists.other) throw new Error('其他成果未切换到清单2');
          if (context.masterList !== lists.other) throw new Error('调用后默认清单未恢复为其他成果清单');
          NODE

          grep -q "hideCollectionBanner();render(false)" reference-library.js
          grep -q "key === 'references'" dashboard-extension.js
          grep -q "task-unit-mappings.js" page-enhancements.js
          python3 <<'PY'
          from pathlib import Path
          text = Path('page-enhancements.js').read_text(encoding='utf-8')
          core = text.index('page-enhancements-core.js')
          mapping = text.index('task-unit-mappings.js')
          dashboard = text.index('dashboard-extension.js')
          if not core < mapping < dashboard:
              raise SystemExit('脚本加载顺序错误')
          PY

          printf 'task mapping and reference banner validation passed\n' > task-mapping-test-result.txt

      - name: Record validation result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task-mapping-test-result.txt
          git commit -m "test: record task mapping validation"
          git push origin HEAD:fix-reference-banner-and-task-mappings
