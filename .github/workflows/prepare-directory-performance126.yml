name: Prepare directory display performance
on:
  push:
    branches: [fix/directory-exceptions-v1.2.6]
    paths: [.github/workflows/prepare-directory-performance126.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build a sidecar index without altering the directories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-auto-classifier.js');s=p.read_text();start=s.index('  function directoryStatus(');end=s.index('\n  // Only explicit',start)
          fast=r'''  // Sidecar lookup over immutable lists; never add directory entries.
            var directoryIndexes=Object.create(null);
            function directoryStatus(key, city, district, unit) {
              if (!key || !city || !district || !unit) return {status:'incomplete',mismatch:false,listedUnits:[]};
              var source=listForKey(key), index=directoryIndexes[key];
              if (!index || index.source!==source) {
                var cities=Object.create(null);
                flattenTasks([key]).forEach(function(r){
                  var c=compact(r.city);
                  (cities[c]||(cities[c]=[])).push({unit:r.unit,forms:regionForms(r.district),
                    municipal:r.district===r.city || /市级|本级|汇总/.test(r.district),merged:r.district==='合并区'});
                });
                index=directoryIndexes[key]={source:source,cities:cities};
              }
              var task=compact(district), municipal=/^(?:市级|市本级|市级汇总|全市)$/.test(district);
              var subs=window.mergeSubDistricts && window.mergeSubDistricts[city] || [];
              var merged=subs.some(function(d){return compact(d)===task;});
              var listed=(index.cities[compact(city)]||[]).filter(function(r){
                return r.forms.includes(task) || r.municipal&&municipal || r.merged&&merged;
              });
              var units=unique(listed.map(function(r){return r.unit;}));
              var status=!listed.length?'unlisted-task':units.some(function(u){return unitMatches(u,unit);})?'matched':'unit-mismatch';
              return {status:status,mismatch:status!=='matched',listedUnits:units};
            }
          '''
          p.write_text(s[:start]+fast+s[end:])
          p=Path('CHANGELOG.md');s=p.read_text();p.write_text(s.replace('## v1.2.6 — 2026-09-23\n','## v1.2.6 — 2026-09-23\n\n- 通讯录核对使用独立只读索引，避免页面渲染反复遍历和规范化全量清单。',1))
          PY
          node --check admin-auto-classifier.js
          node scripts/validate-auto-import-classifier.js
          git diff --quiet -- index.html task-unit-mappings.js data assets replies upload-config.js
      - name: Commit only the two ordinary source files
        run: |
          test "$GITHUB_REF_NAME" = 'fix/directory-exceptions-v1.2.6'
          git add admin-auto-classifier.js CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: index immutable directory by result and city for display checks'
          git push origin HEAD:fix/directory-exceptions-v1.2.6
