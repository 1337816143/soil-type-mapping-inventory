name: Report unit evidence regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed document-test dependencies
        run: python -m pip install PyMuPDF==1.26.4 lxml==6.0.1 numpy==2.2.6 Pillow==11.3.0 python-docx==1.2.0
      - name: Verify report corrections and source boundaries
        run: |
          set -euo pipefail
          python scripts/test-unit-correction.py
          python scripts/test-incoming-unit-repair.py
          python scripts/verify-unit-repair.py
          git diff --exit-code -- index.html task-unit-mappings.js data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-evidence-results
          path: test-artifacts/
          retention-days: 5
