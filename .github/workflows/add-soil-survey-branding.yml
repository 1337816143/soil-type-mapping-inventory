name: Add soil survey branding and split progress panel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-soil-survey-branding.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add logo and update page layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          logo_b64 = ''''''

          assets = Path('assets')
          assets.mkdir(exist_ok=True)
          (assets / 'soil-survey-logo.jpg').write_bytes(base64.b64decode(logo_b64))

          page = Path('index.html')
          html = page.read_text(encoding='utf-8')

          css_anchor = 'footer img{max-height:60px;width:auto}'
          css_extra = '''footer img{max-height:60px;width:auto}
.footer-brands{display:flex;justify-content:center;align-items:center;gap:52px;flex-wrap:wrap}
.footer-brand{display:flex;align-items:center;gap:12px;color:var(--ink);font-size:.95rem;font-weight:600}
.footer-brand img{height:58px;max-height:58px;width:auto;object-fit:contain}
.footer-brand.survey img{height:68px;max-height:68px;border-radius:50%}
.missing-layout{display:grid;grid-template-columns:minmax(500px,1.35fr) minmax(300px,.65fr);gap:18px;align-items:stretch}
.missing-stats-panel,.missing-details-panel{min-width:0}
.missing-panel-title{font-size:.82rem;font-weight:700;color:#92400e;margin-bottom:7px}
.missing-stat-table{width:100%!important;min-width:0!important;table-layout:auto!important;border-collapse:collapse!important;font-size:.82rem!important;margin:0!important}
.missing-stat-table th,.missing-stat-table td{min-width:0!important}
.missing-stat-table th:first-child,.missing-stat-table td:first-child{width:40%!important}
.missing-stat-table th:nth-child(2),.missing-stat-table td:nth-child(2),.missing-stat-table th:nth-child(3),.missing-stat-table td:nth-child(3),.missing-stat-table th:nth-child(4),.missing-stat-table td:nth-child(4){width:20%!important}
.missing-details-panel{border-left:1px solid #fde68a;padding-left:16px}
.missing-details-panel .missing-list{display:flex;flex-direction:column;align-items:stretch;gap:6px;line-height:1.5}
.missing-details-panel .missing-item{white-space:normal;width:100%}
@media(max-width:980px){.missing-layout{grid-template-columns:1fr}.missing-details-panel{border-left:0;border-top:1px solid #fde68a;padding-left:0;padding-top:12px}}
@media(max-width:640px){.footer-brands{gap:24px}.footer-brand{font-size:.86rem}.footer-brand.survey img{height:56px;max-height:56px}.footer-brand img{height:50px;max-height:50px}}'''
          if '.footer-brands{' not in html:
              if css_anchor not in html:
                  raise SystemExit('footer CSS anchor not found')
              html = html.replace(css_anchor, css_extra, 1)

          old_footer = '''<footer>
  <div class="container"><img src="./assets/logo.jpg" alt="中国农业大学"></div>
</footer>'''
          new_footer = '''<footer>
  <div class="container">
    <div class="footer-brands">
      <div class="footer-brand survey"><img src="./assets/soil-survey-logo.jpg" alt="第三次全国土壤普查"><span>第三次全国土壤普查</span></div>
      <div class="footer-brand cau"><img src="./assets/logo.jpg" alt="中国农业大学"><span>中国农业大学</span></div>
    </div>
  </div>
</footer>'''
          if 'soil-survey-logo.jpg' not in html:
              if old_footer not in html:
                  raise SystemExit('footer HTML anchor not found')
              html = html.replace(old_footer, new_footer, 1)

          start = html.index('function renderMissingBanner(dataKey)')
          end = html.index('\n}\n\nvar soilTypeData', start) + 3
          fn = html[start:end]

          old_table_start = '''  // 汇总表
  html += '<table style="width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:' + (allMissing.length > 0 ? '14' : '0') + 'px"><thead>'''
          new_table_start = '''  // 汇总表：左侧统计，右侧缺失
  html += '<div class="missing-layout"><section class="missing-stats-panel"><div class="missing-panel-title">收缴统计</div>';
  html += '<table class="missing-stat-table"><thead>'''
          if 'missing-layout' not in fn:
              if old_table_start not in fn:
                  raise SystemExit('missing table start anchor not found')
              fn = fn.replace(old_table_start, new_table_start, 1)

              old_details = '''  html += '</tbody></table>';
  // 缺失详情
  if (allMissing.length > 0) {
    html += '<div class="missing-list">';
    allMissing.forEach(function(m) {
      html += '<span class="missing-item"><span class="city">' + m.city + '</span><span class="sep">|</span>' + m.district + '<span class="sep">|</span><span class="unit">' + m.unit + '</span> ' + m.contact + ' ' + m.phone + '</span>';
    });
    html += '</div>';
  }
  banner.innerHTML = html;'''
              new_details = '''  html += '</tbody></table></section>';
  // 缺失详情
  html += '<aside class="missing-details-panel"><div class="missing-panel-title">缺失成果</div>';
  if (allMissing.length > 0) {
    html += '<div class="missing-list">';
    allMissing.forEach(function(m) {
      html += '<span class="missing-item"><span class="city">' + m.city + '</span><span class="sep">|</span>' + m.district + '<span class="sep">|</span><span class="unit">' + m.unit + '</span> ' + m.contact + ' ' + m.phone + '</span>';
    });
    html += '</div>';
  } else {
    html += '<div class="missing-empty">暂无缺失成果</div>';
  }
  html += '</aside></div>';
  banner.innerHTML = html;'''
              if old_details not in fn:
                  raise SystemExit('missing details anchor not found')
              fn = fn.replace(old_details, new_details, 1)
              html = html[:start] + fn + html[end:]

          page.write_text(html, encoding='utf-8')
          PY

      - name: Commit migration and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-soil-survey-branding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/soil-survey-logo.jpg .github/workflows/add-soil-survey-branding.yml
          git commit -m "feat: add soil survey branding and split missing panel"
          git push origin main
