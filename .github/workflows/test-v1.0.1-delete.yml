name: Test v1.0.1 admin deletion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-specialty-soil-label-v1.0.1
          fetch-depth: 0

      - run: npm install --no-save --no-package-lock jsdom@24

      - name: Validate labels and deletion transaction
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-delete-manager.js
          node scripts/validate-project.js

          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const {JSDOM} = require('jsdom');

          const reference = fs.readFileSync('reference-library.js', 'utf8');
          const categoryBlock = reference.slice(reference.indexOf('var CATEGORY_ORDER'), reference.indexOf('];', reference.indexOf('var CATEGORY_ORDER')));
          if (!categoryBlock.includes("'土特产品土壤适宜性评价'")) throw new Error('参考文件缺少新分组名称');
          if (categoryBlock.includes("'土特产品适宜性评价'")) throw new Error('参考文件仍保留旧的多余分组');
          if (!reference.includes("compact.indexOf('土特产品适宜性评价')")) throw new Error('旧目录未映射到新分组');
          if (!fs.readFileSync('dashboard-extension.js', 'utf8').includes("specialty: '土特产品土壤适宜性评价'")) throw new Error('标签页名称未更新');

          const dom = new JSDOM('<!doctype html><html><head></head><body></body></html>', {runScripts:'outside-only', url:'https://example.test/'});
          const window = dom.window;
          const context = dom.getInternalVMContext();
          Object.defineProperty(window.document, 'readyState', {value:'complete', configurable:true});
          window.SOIL_GITHUB_UPLOAD_TOKEN = 'test-token';
          window.confirm = () => true;
          window.showToast = () => {};

          const qualityPath = 'data/质控意见反馈_管理员导入/土壤类型图/测试市/测试单位/意见.pdf';
          const replyPath = 'replies/测试市_测试单位_测试区_批次-第一批_整改答复_20260727120000.pdf';
          const referencePath = 'reference-files/third-soil-survey/土特产品适宜性评价/旧目录资料.pdf';
          const index = [{kind:'quality-control', dataKey:'soilType', city:'测试市', unit:'测试单位', district:'测试区', batch:'第一批', path:qualityPath}];
          const tree = [
            {type:'blob', path:qualityPath, size:100},
            {type:'blob', path:replyPath, size:200},
            {type:'blob', path:referencePath, size:300},
            {type:'blob', path:'data/admin-import-index.json', size:20}
          ];

          let blobPayload = null;
          let treePayload = null;
          let commitPayload = null;
          let refPayload = null;
          let qualityRefresh = false;
          let replyRefresh = false;
          let referenceRefresh = false;
          let progressRefresh = false;

          window.SoilRepoAdmin = {
            size: n => n + ' B',
            loadTree: () => Promise.resolve(tree.slice()),
            tree: tree.slice()
          };
          window.SoilAdminImport = {PASS:'478666', state:{index:index.slice()}};
          window.removeAdminQualityPaths = paths => { qualityRefresh = paths.includes(qualityPath); };
          window.reloadReplyIndex = () => { replyRefresh = true; };
          window.refreshSoilReferenceLibrary = () => { referenceRefresh = true; };
          window.SoilRegionalProgress = {refresh:() => { progressRefresh = true; }};

          function response(data, status=200) {
            return Promise.resolve({
              ok: status >= 200 && status < 300,
              status,
              text: () => Promise.resolve(JSON.stringify(data)),
              json: () => Promise.resolve(data)
            });
          }

          window.fetch = (url, options={}) => {
            const value = String(url);
            if (value.includes('raw.githubusercontent.com')) return response(index);
            if (value.endsWith('/user')) return response({login:'tester'});
            if (value.endsWith('/git/ref/heads/main')) return response({object:{sha:'base-commit'}});
            if (value.includes('/git/trees/main?recursive=1')) return response({tree:tree});
            if (value.endsWith('/git/commits/base-commit')) return response({tree:{sha:'base-tree'}});
            if (value.endsWith('/git/blobs') && options.method === 'POST') {
              blobPayload = JSON.parse(options.body);
              return response({sha:'index-blob'});
            }
            if (value.endsWith('/git/trees') && options.method === 'POST') {
              treePayload = JSON.parse(options.body);
              return response({sha:'new-tree'});
            }
            if (value.endsWith('/git/commits') && options.method === 'POST') {
              commitPayload = JSON.parse(options.body);
              return response({sha:'new-commit'});
            }
            if (value.endsWith('/git/refs/heads/main') && options.method === 'PATCH') {
              refPayload = JSON.parse(options.body);
              return response({object:{sha:'new-commit'}});
            }
            throw new Error('未处理请求：' + value + ' ' + (options.method || 'GET'));
          };

          vm.runInContext(fs.readFileSync('admin-delete-manager.js', 'utf8'), context);

          (async () => {
            await window.openSoilAdminDelete({scope:'all'});
            const checks = Array.from(window.document.querySelectorAll('.delete-check'));
            if (checks.length !== 3) throw new Error('删除列表应包含3个受管文件，实际为' + checks.length);
            checks.forEach(input => { input.checked = true; });
            window.document.getElementById('delete-pass').value = '478666';
            window.document.getElementById('delete-submit').click();
            await new Promise(resolve => setTimeout(resolve, 250));

            if (!treePayload || !commitPayload || !refPayload) throw new Error('删除事务未完整创建 Tree/Commit/Ref');
            const deleted = treePayload.tree.filter(item => item.sha === null).map(item => item.path).sort();
            const expected = [qualityPath, replyPath, referencePath].sort();
            if (JSON.stringify(deleted) !== JSON.stringify(expected)) throw new Error('删除路径不正确：' + JSON.stringify(deleted));
            const indexEntry = treePayload.tree.find(item => item.path === 'data/admin-import-index.json');
            if (!indexEntry || indexEntry.sha !== 'index-blob') throw new Error('质控索引未写入同一Tree');
            const updatedIndex = JSON.parse(blobPayload.content);
            if (updatedIndex.length !== 0) throw new Error('质控索引未删除对应记录');
            if (commitPayload.parents[0] !== 'base-commit' || refPayload.sha !== 'new-commit' || refPayload.force !== false) throw new Error('提交或分支更新参数错误');
            if (!qualityRefresh || !replyRefresh || !referenceRefresh || !progressRefresh) throw new Error('删除后页面刷新链路不完整');
            console.log('v1.0.1 deletion transaction validation passed');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
