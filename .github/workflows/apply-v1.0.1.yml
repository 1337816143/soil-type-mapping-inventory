name: Apply v1.0.1 integration

on:
  push:
    branches: [fix-specialty-soil-label-v1.0.1]
    paths:
      - '.github/workflows/apply-v1.0.1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-specialty-soil-label-v1.0.1
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/apply-v1.0.1.py

      - name: Validate patched files
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-delete-manager.js
          node --check dashboard-extension.js
          node --check reference-library.js
          node --check regional-progress-dashboard.js
          node --check upload-auth-reply-batch.js
          node --check page-enhancements.js
          node scripts/validate-project.js
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/deploy.yml')"

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md upload-config.js app-release-ui.js regional-progress-dashboard.js dashboard-extension.js reference-library.js upload-auth-reply-batch.js page-enhancements.js admin-delete-manager.js scripts/validate-project.js .github/workflows/deploy.yml
          git commit -m "feat: add v1.0.1 labels and admin deletion"
          git push origin HEAD:fix-specialty-soil-label-v1.0.1
