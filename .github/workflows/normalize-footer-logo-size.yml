name: Normalize footer logo size

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-footer-logo-size.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize logo dimensions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'width:68px!important;height:68px!important;': 'width:58px!important;height:58px!important;',
              'min-width:68px!important;max-width:68px!important;': 'min-width:58px!important;max-width:58px!important;',
              'min-height:68px!important;max-height:68px!important;': 'min-height:58px!important;max-height:58px!important;',
              'flex-basis:68px!important;': 'flex-basis:58px!important;',
              'width:56px!important;height:56px!important;': 'width:50px!important;height:50px!important;',
              'min-width:56px!important;max-width:56px!important;': 'min-width:50px!important;max-width:50px!important;',
              'min-height:56px!important;max-height:56px!important;': 'min-height:50px!important;max-height:50px!important;',
              'flex-basis:56px!important;': 'flex-basis:50px!important;',
              'page-enhancements.js?v=20260725-3': 'page-enhancements.js?v=20260725-4',
          }

          for path in Path('.').glob('*.js'):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.js'
          git commit -m "fix: match footer logo dimensions" || exit 0
          git push origin main
