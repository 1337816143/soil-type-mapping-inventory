name: One-off v1.1.6 changelog sync

on:
  push:
    branches:
      - fix/reference-upload-isolation-v1.1.6

permissions:
  contents: write

jobs:
  sync-changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reference-upload-isolation-v1.1.6
          fetch-depth: 0
      - name: Prepend v1.1.6 changelog
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          if '## v1.1.6 — 2026-08-20' in text:
              raise SystemExit(0)
          entry = '''## v1.1.6 — 2026-08-20

- 参考文件“管理员导入”从共享质控管理员导入彻底拆分为独立的 `reference-upload.js` 界面、状态、文件分类和上传链路；参考资料不再调用 `SoilAdminImport` / `SoilAdminAutoClassifier`，质控成果自动识别不会在参考资料入口运行。
- 新参考资料自动识别只根据文件名和 ZIP/文件夹相对路径匹配 7 类参考资料目录；无法识别时明确落到参考资料根目录；每个文件可手动选择归档目录，并用 `manualDirectory` 锁定，异步目录刷新不会再覆盖用户选择；支持“一键应用到全部”和“重新自动识别”。
- 重做参考资料手机端上传窗口：使用 `visualViewport`、安全区、窄屏及低高度横屏布局，标题、关闭按钮和底部操作保持可见；增加独立手机 ZIP 入口。
- 参考资料上传改用专用 `.reference-upload` 暂存目录、`reference-upload-*` 分支和 `import-reference.yml` Actions；只允许写入 `reference-files/third-soil-survey`，不读写质控索引；39 MiB 以下整文件、以上分块暂存，最大 95 MiB，归档后独立触发 Pages 部署。
- 上传进度由参考资料模块原位更新并使用有界阶段推进，不再经过质控进度包装或 DOM 监听；上传成功继续显示“上传成功！稍等3~5分钟刷新网站即可查看新上传的文件。”。
- 加入独立上传隔离回归测试和 CI/Pages 校验；内置 GitHub Token 字节内容未修改，质控意见上传、北部共享材料、整改答复、管理员删除、预览/批量下载等既有功能保持不变。

'''
          if not text.startswith('# Changelog\n'):
              raise SystemExit('CHANGELOG.md 头部格式异常')
          p.write_text('# Changelog\n\n' + entry + text[len('# Changelog\n'):].lstrip('\n'), encoding='utf-8')
          PY
          git diff --check
      - name: Commit changelog
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: add v1.1.6 changelog"
          git push origin HEAD:fix/reference-upload-isolation-v1.1.6
