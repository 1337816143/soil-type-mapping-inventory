name: Prepare workspace reliability patch
on:
  push:
    branches: [fix/workspace-reliability-v1.2.1]
    paths:
      - scripts/prepare-workspace-v1.2.1.py
      - .github/workflows/prepare-workspace-reliability.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workspace-reliability-v1.2.1
          fetch-depth: 1
      - name: Apply bounded patch and validate
        run: |
          set -euo pipefail
          python3 scripts/prepare-workspace-v1.2.1.py
          node --check work-records.js
          node --check work-records-core.js
          python3 -m py_compile scripts/test-workspace-browser.py
          node scripts/validate-workspace.js
          node scripts/validate-project.js
          node scripts/validate-reply-workflow.js
          node scripts/validate-reference-upload-isolation.js
          node scripts/validate-file-preview-batch-download.js
          node scripts/validate-document-preview-controls.js
          node scripts/validate-mobile-dialog-reference-batch.js
      - name: Commit reviewed-scope changes to feature branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION CHANGELOG.md app-release-ui.js app-version-guard.js index.html page-enhancements.js upload-config.js work-records-core.js work-records.js scripts/test-workspace-browser.py scripts/validate-workspace.js
          git commit -m 'fix: v1.2.1 workspace draft lifecycle and stale-refresh protection'
          git push origin HEAD:fix/workspace-reliability-v1.2.1
