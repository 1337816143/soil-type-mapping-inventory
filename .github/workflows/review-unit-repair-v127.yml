name: Review unit correction evidence v127
on:
  push:
    branches: [fix/evidence-unit-repair-v1.2.7]
    paths: [.github/workflows/review-unit-repair-v127.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: python -m pip install PyMuPDF==1.26.4 lxml==6.0.1
      - name: Export credential-free source, header evidence and example originals
        run: |
          python - <<'PY'
          import subprocess, zipfile, re, json, hashlib
          from pathlib import Path
          from lxml import etree
          import pymupdf
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          listing=[]; headers=[]
          with zipfile.ZipFile('/tmp/unit-review.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p=Path(name)
                  if not p.is_file(): continue
                  listing.append({'path':name,'size':p.stat().st_size})
                  if p.suffix.lower() in {'.js','.css','.html','.json','.py','.yml','.md'} or name=='VERSION':
                      text=p.read_text(encoding='utf-8')
                      if name=='upload-config.js':
                          fake=','.join(str(ord(c)) for c in 'github_pat_'+'x'*82)
                          text=re.sub(r'var tokenCodes = \[[^\]]+\]', 'var tokenCodes = ['+fake+']', text)
                      z.writestr(name,text)
                  elif p.suffix.lower() in {'.pdf','.docx','.doc'} and not name.startswith(('reference-files/','replies/','work-record-attachments/')):
                      h={'path':name,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                      try:
                          if p.suffix.lower()=='.pdf':
                              with pymupdf.open(p) as d:
                                  h['pages']=len(d);h['header']='\n'.join(d[i].get_text() for i in range(min(2,len(d))))
                          elif p.suffix.lower()=='.docx':
                              with zipfile.ZipFile(p) as dz:
                                  root=etree.fromstring(dz.read('word/document.xml'))
                                  paragraphs=root.xpath('//*[local-name()="p"]')
                                  h['header']='\n'.join(''.join(q.xpath('.//*[local-name()="t"]/text()')) for q in paragraphs[:80])
                          else:h['error']='legacy DOC; no automatic text extraction'
                      except Exception as e:h['error']=str(e)[:200]
                      headers.append(h)
                      if re.search('平山|行唐|灵寿|新乐|内丘|任泽|任县',p.name): z.write(p,name)
                  elif name.startswith('assets/') and p.suffix.lower() in {'.png','.jpg','.svg'}:z.write(p,name)
              z.writestr('_review-tree.json',json.dumps(listing,ensure_ascii=False,indent=2))
              z.writestr('_review-headers.json',json.dumps(headers,ensure_ascii=False,indent=2))
          print('Documents:',len(headers),'archive bytes:',Path('/tmp/unit-review.zip').stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: unit-review-bounded
          path: /tmp/unit-review.zip
          retention-days: 2
