name: Prepare outside-directory v126
on:
  push:
    branches: [fix/outside-directory-v1.2.6]
    paths: [.github/workflows/prepare-outside-v126.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate patch, source boundaries and apply
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, re, zlib, subprocess
          assert Path('VERSION').read_text().strip() == 'v1.2.5', 'Baseline changed'
          token = re.search(r'var tokenCodes = \[[^\]]+\]', Path('upload-config.js').read_text()).group()
          encoded = ''.join(''.join(Path('.github/patch126-'+letter+'.txt').read_text().split()) for letter in 'abcd')
          data = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == '3b694088472babbb642b707c3379cb67d96f704cc4825dd7082a22b47415d8ba', 'Patch checksum mismatch; no source changed'
          updates = json.loads(data)
          prepared = {}
          for update in updates:
              p=Path(update['path'])
              assert not p.is_absolute() and '..' not in p.parts
              old=p.read_text() if p.exists() else ''
              if update['base'] is None:
                  assert not p.exists(), str(p)
              else:
                  assert hashlib.sha256(old.encode()).hexdigest() == update['base'], 'Baseline mismatch: '+str(p)
              result=old
              for start,end,text in reversed(update['edits']):
                  assert 0 <= start <= end <= len(old)
                  result=result[:start]+text+result[end:]
              assert hashlib.sha256(result.encode()).hexdigest() == update['result'], 'Output mismatch: '+str(p)
              prepared[p]=result
          for p,result in prepared.items():
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(result)
          subprocess.run(['node','scripts/bump-version.js','patch'],check=True)
          assert token == re.search(r'var tokenCodes = \[[^\]]+\]', Path('upload-config.js').read_text()).group(), 'Credential changed'
          allowed=set(str(p) for p in prepared)|{'VERSION','upload-config.js','app-release-ui.js','app-version-guard.js','page-enhancements.js','index.html'}
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          assert changed<=allowed, changed-allowed
          assert subprocess.run(['git','diff','--quiet','--','task-unit-mappings.js','data','work-records.js','work-records-core.js','replies','assets']).returncode == 0
          print('Checksum-verified bounded patch applied; lists, data and credential untouched')
          PY
          node --check admin-auto-classifier.js
          node --check page-enhancements-core.js
          node scripts/validate-project.js
          node scripts/validate-auto-import-classifier.js
          node scripts/validate-workspace.js
          node scripts/validate-app-boot.js
      - name: Commit ordinary source on feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/outside-directory-v1.2.6'
          cp .github/workflows/import-chunked.yml .github/import-chunked-v126.yml
          git restore --source=HEAD -- .github/workflows/import-chunked.yml
          git rm .github/patch126-a.txt .github/patch126-b.txt .github/patch126-c.txt .github/patch126-d.txt .github/prepare-outside-1.b64
          git add -u
          git add .github/import-chunked-v126.yml scripts/check-directory-ui.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: v1.2.6 confirmed outside-directory tasks, batch fill and red discrepancy hints'
          git push origin HEAD:fix/outside-directory-v1.2.6
          git rev-parse HEAD
          git hash-object .github/import-chunked-v126.yml
