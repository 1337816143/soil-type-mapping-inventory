name: Prepare scoring feature on isolated branch
on:
  push:
    branches: [feat/scoring-files-v1.2.19]
    paths:
      - '.github/workflows/prepare-scoring-v1219.yml'
      - 'scripts/prepare-scoring-v1219.py'
      - 'scripts/validate-scoring-files.js'
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/scoring-files-v1.2.19'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prepare source changes and run isolated scoring regression
        run: |
          set -euo pipefail
          python3 scripts/prepare-scoring-v1219.py
          node --check admin-auto-classifier.js
          node --check admin-import-v2.js
          node --check hybrid-staged-upload.js
          node --check file-preview-batch-download.js
          node scripts/validate-scoring-files.js
          node scripts/validate-upload-metadata.js
          node scripts/validate-reference-upload-isolation.js
          node scripts/validate-admin-progress-wrapper.js
      - name: Store reviewed source tree without updating any branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, json, subprocess, urllib.request
          from pathlib import Path
          # No user PAT is read or used. This is the repository-scoped Actions
          # credential; only Git blobs/trees are created, never a branch ref.
          allowed = {'admin-auto-classifier.js','admin-import-v2.js','hybrid-staged-upload.js',
            'dashboard-extension.js','page-enhancements-core.js','file-preview-batch-download.js',
            'glass-interface.css','.github/workflows/import-chunked.yml','.github/workflows/import-release.yml',
            '.github/workflows/deploy.yml','.github/workflows/security-audit.yml',
            'VERSION','upload-config.js','app-release-ui.js','app-version-guard.js','page-enhancements.js','index.html','CHANGELOG.md'}
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if not changed.issubset(allowed):
              raise SystemExit('Unexpected changed files: '+repr(changed-allowed))
          import re
          before = subprocess.check_output(['git','show','HEAD:upload-config.js'],text=True)
          after = Path('upload-config.js').read_text()
          token_array = r'var tokenCodes = \[([0-9,\s]+)\]'
          assert re.search(token_array,before)[0] == re.search(token_array,after)[0], 'Embedded credential changed'
          base_tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          base_commit = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          api = 'https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def post(endpoint, body):
              request = urllib.request.Request(api+endpoint,data=json.dumps(body).encode(),
                headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              return json.load(urllib.request.urlopen(request,timeout=60))
          entries=[]
          for filename in sorted(changed|{'docs/SCORING_FILES.md'}):
              blob=post('/git/blobs',{'content':Path(filename).read_text(encoding='utf-8'),'encoding':'utf-8'})
              entries.append({'path':filename,'mode':'100644','type':'blob','sha':blob['sha']})
          # One-time preparation files must not be included in the release.
          for filename in ['scripts/prepare-scoring-v1219.py','.github/workflows/prepare-scoring-v1219.yml']:
              entries.append({'path':filename,'mode':'100644','type':'blob','sha':None})
          result=post('/git/trees',{'base_tree':base_tree,'tree':entries})
          print('PREPARED_SCORING_TREE='+json.dumps({'sha':result['sha'],'parent':base_commit,'files':len(entries)},ensure_ascii=False))
          PY
