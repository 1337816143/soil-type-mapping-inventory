name: Probe municipal task labels

on:
  push:
    branches: [fix-regional-progress-dashboard]
    paths:
      - '.github/workflows/probe-municipal-labels.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-regional-progress-dashboard
          fetch-depth: 0

      - name: Extract submitted labels
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('var soilTypeData = [');
          const end = html.indexOf('\nvar soilAttrData = [', start);
          if (start < 0 || end < 0) throw new Error('无法定位 soilTypeData');
          const source = html.slice(start, end);
          const context = {};
          vm.createContext(context);
          vm.runInContext(source, context);
          const cities = ['石家庄市','邢台市','沧州市','衡水市','邯郸市'];
          const report = {};
          for (const city of context.soilTypeData || []) {
            if (!cities.includes(city.name)) continue;
            report[city.name] = [];
            for (const unit of city.units || []) {
              for (const d of unit.districts || []) {
                const label = String(d.label || '');
                if (label.includes('市') || label.includes('合并') || label.includes('本级')) {
                  report[city.name].push({unit: unit.name, label});
                }
              }
            }
          }
          fs.writeFileSync('municipal-label-probe.json', JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Record probe
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add municipal-label-probe.json
          git commit -m "test: record municipal label probe"
          git push origin HEAD:fix-regional-progress-dashboard
