name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            index.html
            upload-config.js
            page-enhancements.js
            assets
            data
            replies
          sparse-checkout-cone-mode: false

      - name: Validate deploy files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f upload-config.js
          test -f page-enhancements.js
          test -f assets/soil-survey-logo.svg
          grep -q 'calculateDashboardStats(dataKey)' index.html
          grep -q 'upload-config.js' index.html
          grep -q 'SOIL_UPLOAD_API_URL' upload-config.js
          grep -q 'page-enhancements.js' upload-config.js
          grep -q './assets/soil-survey-logo.svg' page-enhancements.js
          grep -q '第三次全国土壤普查' page-enhancements.js
          grep -q 'missing-layout' page-enhancements.js
          if grep -q '<span>中国农业大学</span>' page-enhancements.js; then
            echo '检测到重复的中国农业大学文字，停止部署。'
            exit 1
          fi
          echo '部署文件校验通过。'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
