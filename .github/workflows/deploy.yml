name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最新一次部署。上传文件已经先提交到 main，取消旧部署不会丢失任何上传结果；
# 最新提交天然包含此前所有提交，可避免多个 Pages 部署相互竞争。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            index.html
            upload-config.js
            page-enhancements.js
            assets
            data
            replies
          sparse-checkout-cone-mode: false

      - name: Validate deploy files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f upload-config.js
          test -f page-enhancements.js
          grep -q 'calculateDashboardStats(dataKey)' index.html
          grep -q 'upload-config.js' index.html
          grep -q 'SOIL_UPLOAD_API_URL' upload-config.js
          grep -q 'page-enhancements.js' upload-config.js
          grep -q '第三次全国土壤普查' page-enhancements.js
          grep -q 'missing-layout' page-enhancements.js
          echo '部署文件校验通过。'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
