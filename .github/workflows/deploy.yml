name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            VERSION
            CHANGELOG.md
            index.html
            upload-config.js
            page-enhancements.js
            page-enhancements-core.js
            app-release-ui.js
            task-unit-mappings.js
            regional-progress-dashboard.js
            dashboard-extension.js
            reference-library.js
            admin-import.js
            admin-quality-ui.js
            admin-quality-upload.js
            admin-import-v2.js
            admin-import-v2-bridge.js
            reference-import-mode.js
            upload-auth-reply-batch.js
            upload-token-default.js
            pptx-auto-split.js
            hybrid-staged-upload.js
            chunked-staged-upload.js
            release-upload-reliability.js
            release-staged-upload.js
            scripts
            assets
            data
            replies
          sparse-checkout-cone-mode: false

      - name: Validate deploy files
        shell: bash
        run: |
          set -euo pipefail
          test -f VERSION
          test -f CHANGELOG.md
          test -f index.html
          test -f upload-config.js
          test -f page-enhancements.js
          test -f page-enhancements-core.js
          test -f app-release-ui.js
          test -f task-unit-mappings.js
          test -f regional-progress-dashboard.js
          test -f dashboard-extension.js
          test -f reference-library.js
          test -f admin-import.js
          test -f admin-quality-ui.js
          test -f admin-quality-upload.js
          test -f admin-import-v2.js
          test -f admin-import-v2-bridge.js
          test -f reference-import-mode.js
          test -f upload-auth-reply-batch.js
          test -f upload-token-default.js
          test -f pptx-auto-split.js
          test -f hybrid-staged-upload.js
          test -f chunked-staged-upload.js
          test -f release-upload-reliability.js
          test -f release-staged-upload.js
          test -f scripts/validate-project.js
          test -f assets/soil-survey-logo.svg
          test -f data/admin-import-index.json

          node --check upload-config.js
          node --check page-enhancements.js
          node --check app-release-ui.js
          node --check regional-progress-dashboard.js
          node --check reference-library.js
          node scripts/validate-project.js

          grep -qx 'v1.0.0' VERSION
          grep -q '## v1.0.0' CHANGELOG.md
          grep -q "window.SOIL_APP_VERSION = 'v1.0.0'" upload-config.js
          grep -q 'page-enhancements.js?v=20260727-11' upload-config.js
          grep -q 'page-enhancements-core.js' page-enhancements.js
          grep -q 'task-unit-mappings.js' page-enhancements.js
          grep -q 'regional-progress-dashboard.js?v=20260727-5' page-enhancements.js
          grep -q 'dashboard-extension.js?v=20260727-3' page-enhancements.js
          grep -q 'reference-library.js?v=20260727-3' page-enhancements.js
          grep -q 'app-release-ui.js?v=1.0.0' page-enhancements.js
          grep -q 'page-title-logo-frame' app-release-ui.js
          grep -q 'app-version-badge' app-release-ui.js
          grep -q 'group.open = false' app-release-ui.js

          grep -q 'SoilTaskUnitLists' task-unit-mappings.js
          grep -q "dataKey === 'soilType'" task-unit-mappings.js
          grep -q '中地科勘察设计有限公司' task-unit-mappings.js
          grep -q '石家庄师兄弟土地环境技术服务有限公司' task-unit-mappings.js
          grep -q '河北省北部片区' regional-progress-dashboard.js
          grep -q '河北省南部片区' regional-progress-dashboard.js
          grep -q "'秦皇岛市','保定市','承德市','雄安新区','唐山市','廊坊市','张家口市'" regional-progress-dashboard.js
          grep -q "return '成果'" regional-progress-dashboard.js
          grep -q '土壤退化与障碍分析' regional-progress-dashboard.js
          grep -q "progressChip('区县'" regional-progress-dashboard.js
          grep -q 'expectedUnitKeys:new Set()' regional-progress-dashboard.js
          grep -q 'receivedUnitKeys:new Set()' regional-progress-dashboard.js
          grep -q '作业单位（去重）' regional-progress-dashboard.js
          grep -q 'regional-progress-table-wrap' regional-progress-dashboard.js
          grep -q 'table-layout:fixed' regional-progress-dashboard.js
          grep -q 'text-align:center' regional-progress-dashboard.js
          grep -q '市级进度（已收 / 应有）' regional-progress-dashboard.js
          grep -q '每次调用都从当前 tabData' regional-progress-dashboard.js
          grep -q 'refresh:refreshActiveProgress' regional-progress-dashboard.js
          grep -q '页面整体统计、南北片区及明细表共用同一个实时计算入口' regional-progress-dashboard.js

          grep -q "setHeadingText(heading, TYPES\[key\] + '收缴进度')" dashboard-extension.js
          grep -q "var PAGE_TITLE = '三普成果编制及质控参考资料'" reference-library.js
          grep -q 'SoilReferenceLibraryConfig' reference-library.js
          grep -q 'CATEGORY_ORDER.forEach' reference-library.js
          grep -q '暂无参考文件' reference-library.js
          grep -q 'ref-page-title' reference-library.js

          if grep -q '分片区收缴进度' regional-progress-dashboard.js; then
            echo '检测到旧的分片区标题，停止部署。'
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          script = Path('regional-progress-dashboard.js').read_text(encoding='utf-8')
          heading = script.index("esc(name) + '收缴进度</h3>'")
          summary = script.index('renderOverallSummary(progress.overall)', heading)
          regions = script.index('REGION_ORDER.map', summary)
          if not heading < summary < regions:
              raise SystemExit('收缴进度布局顺序不是“标题→整体统计→南北片区”')

          loader = Path('page-enhancements.js').read_text(encoding='utf-8')
          order = [
              loader.index('page-enhancements-core.js'),
              loader.index('task-unit-mappings.js'),
              loader.index('regional-progress-dashboard.js'),
              loader.index('dashboard-extension.js'),
              loader.index('reference-library.js'),
              loader.index('app-release-ui.js'),
          ]
          if order != sorted(order):
              raise SystemExit('v1.0.0 页面脚本加载顺序错误')
          PY

          grep -q "key === 'references'" dashboard-extension.js
          grep -q 'hideCollectionBanner' reference-library.js
          grep -q 'SOIL_GITHUB_DEFAULT_UPLOAD_TOKEN' upload-config.js
          grep -q 'soilGithubUploadTokenV2' upload-token-default.js
          grep -q 'SINGLE_BLOB_LIMIT = 39 \* 1024 \* 1024' hybrid-staged-upload.js
          grep -q 'CHUNK_SIZE = 39 \* 1024 \* 1024' hybrid-staged-upload.js
          grep -q "storage: item.file.size <= SINGLE_BLOB_LIMIT ? 'whole' : 'chunked'" hybrid-staged-upload.js
          grep -q '正在整文件上传' hybrid-staged-upload.js
          grep -q '39 MiB 分块' hybrid-staged-upload.js
          grep -q 'applyAdminQualityIndex' hybrid-staged-upload.js
          grep -q 'hybrid-staged-upload.js' release-staged-upload.js
          grep -q '土壤退化与障碍分析' dashboard-extension.js
          grep -q '土特产品适宜性评价' dashboard-extension.js
          grep -q '土壤农业利用适宜性评价' dashboard-extension.js
          grep -q '土地资源评价与利用报告' dashboard-extension.js
          grep -q '耕地质量等级评价' dashboard-extension.js
          grep -q '管理员导入质控意见' dashboard-extension.js
          grep -q '新增批次' admin-import-v2.js
          grep -q '自动归档与预览' admin-import-v2.js
          grep -q '不同批次独立保存' admin-import-v2.js
          grep -q 'sourcePath' admin-import-v2-bridge.js
          grep -q '识别归档目录' reference-import-mode.js
          grep -q '对应质控批次' upload-auth-reply-batch.js
          grep -q '更新GitHub上传凭证' upload-auth-reply-batch.js
          grep -q '按原始幻灯片顺序连续拆分' pptx-auto-split.js
          if grep -q '<span>中国农业大学</span>' page-enhancements-core.js; then
            echo '检测到重复的中国农业大学文字，停止部署。'
            exit 1
          fi
          echo '部署文件校验通过。'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
