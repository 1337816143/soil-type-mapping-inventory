name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            VERSION
            VERSIONING.md
            MAINTENANCE_RULES.md
            CHANGELOG.md
            index.html
            upload-config.js
            page-enhancements.js
            page-enhancements-core.js
            app-release-ui.js
            app-version-guard.js
            repository-manifest-loader.js
            file-preview-batch-download.js
            reply-workflow-core.js
            reply-upload-progress.js
            upload-success-notice.js
            soil-survey-logo-v1.0.2.js
            admin-delete-manager.js
            admin-upload-transport-fix.js
            task-unit-mappings.js
            quality-file-routing.js
            admin-auto-classifier.js
            north-quality-authority-bridge.js
            north-quality-upload-adapter.js
            mobile-file-picker-fix.js
            regional-progress-dashboard.js
            dashboard-extension.js
            reference-library.js
            admin-import.js
            admin-quality-ui.js
            admin-quality-upload.js
            admin-import-v2.js
            admin-import-v2-bridge.js
            reference-import-mode.js
            upload-auth-reply-batch.js
            upload-token-default.js
            pptx-auto-split.js
            hybrid-staged-upload.js
            chunked-staged-upload.js
            release-upload-reliability.js
            release-staged-upload.js
            .github/workflows/import-chunked.yml
            scripts
            assets
            data
            replies
          sparse-checkout-cone-mode: false

      - name: Build static repository directory manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/build-repository-manifest.py --output data/repository-tree.json

      - name: Validate deploy files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            VERSION VERSIONING.md MAINTENANCE_RULES.md CHANGELOG.md index.html upload-config.js
            page-enhancements.js page-enhancements-core.js app-release-ui.js
            app-version-guard.js repository-manifest-loader.js file-preview-batch-download.js reply-workflow-core.js
            reply-upload-progress.js upload-success-notice.js soil-survey-logo-v1.0.2.js
            admin-delete-manager.js admin-upload-transport-fix.js
            task-unit-mappings.js quality-file-routing.js admin-auto-classifier.js
            north-quality-authority-bridge.js north-quality-upload-adapter.js mobile-file-picker-fix.js
            regional-progress-dashboard.js dashboard-extension.js reference-library.js admin-import.js
            admin-quality-ui.js admin-quality-upload.js admin-import-v2.js
            admin-import-v2-bridge.js reference-import-mode.js
            upload-auth-reply-batch.js upload-token-default.js
            pptx-auto-split.js hybrid-staged-upload.js
            chunked-staged-upload.js release-upload-reliability.js
            release-staged-upload.js .github/workflows/import-chunked.yml scripts/validate-project.js
            scripts/validate-upload-token.js scripts/validate-reply-workflow.js
            scripts/validate-reply-upload-progress.js scripts/validate-app-boot.js
            scripts/validate-admin-upload-transport.js scripts/validate-north-quality-routing.js
            scripts/validate-auto-import-classifier.js scripts/validate-north-shared-workflow.js
            scripts/validate-north-authority.js scripts/validate-mobile-file-picker.js
            scripts/validate-file-preview-batch-download.js
            scripts/build-repository-manifest.py scripts/bump-version.js
            data/admin-import-index.json data/north-quality-feedback-package.json data/repository-tree.json
          )
          for file in "${required_files[@]}"; do test -f "$file"; done

          node --check upload-config.js
          node --check page-enhancements.js
          node --check app-release-ui.js
          node --check app-version-guard.js
          node --check repository-manifest-loader.js
          node --check file-preview-batch-download.js
          node --check quality-file-routing.js
          node --check admin-auto-classifier.js
          node --check north-quality-authority-bridge.js
          node --check north-quality-upload-adapter.js
          node --check mobile-file-picker-fix.js
          node --check reply-workflow-core.js
          node --check reply-upload-progress.js
          node --check upload-success-notice.js
          node --check soil-survey-logo-v1.0.2.js
          node --check admin-delete-manager.js
          node --check admin-upload-transport-fix.js
          node --check hybrid-staged-upload.js
          node --check regional-progress-dashboard.js
          node --check dashboard-extension.js
          node --check reference-library.js
          node --check upload-auth-reply-batch.js
          node --check upload-token-default.js
          node --check scripts/bump-version.js
          node --check scripts/validate-upload-token.js
          node --check scripts/validate-reply-workflow.js
          node --check scripts/validate-reply-upload-progress.js
          node --check scripts/validate-app-boot.js
          node --check scripts/validate-admin-upload-transport.js
          node --check scripts/validate-north-quality-routing.js
          node --check scripts/validate-auto-import-classifier.js
          node --check scripts/validate-north-shared-workflow.js
          node --check scripts/validate-north-authority.js
          node --check scripts/validate-mobile-file-picker.js
          node --check scripts/validate-file-preview-batch-download.js
          python3 -m py_compile scripts/build-repository-manifest.py
          node scripts/validate-upload-token.js
          node scripts/validate-reply-workflow.js
          node scripts/validate-reply-upload-progress.js
          node scripts/validate-app-boot.js
          node scripts/validate-admin-upload-transport.js
          node scripts/validate-north-quality-routing.js
          node scripts/validate-auto-import-classifier.js
          node scripts/validate-north-shared-workflow.js
          node scripts/validate-north-authority.js
          node scripts/validate-mobile-file-picker.js
          node scripts/validate-file-preview-batch-download.js
          node scripts/validate-project.js

          python3 <<'PY'
          import json
          from pathlib import Path

          version = Path('VERSION').read_text(encoding='utf-8').strip()
          payload = json.loads(Path('data/repository-tree.json').read_text(encoding='utf-8'))
          tree = payload.get('tree')
          if payload.get('appVersion') != version:
              raise SystemExit('静态目录清单版本与 VERSION 不一致')
          if not isinstance(tree, list):
              raise SystemExit('静态目录清单缺少 tree 数组')
          if not any(str(item.get('path', '')).startswith('reference-files/third-soil-survey/') for item in tree):
              raise SystemExit('静态目录清单未包含三普参考资料目录')
          if payload.get('source') != 'authenticated-github-tree-api':
              raise SystemExit('Pages 部署未使用认证 GitHub Tree API 生成目录清单')
          north = json.loads(Path('data/north-quality-feedback-package.json').read_text(encoding='utf-8'))
          if north.get('documentCount') != 28 or len(north.get('documents') or []) != 28:
              raise SystemExit('北部质控材料清单应为28份')
          if north.get('associationStatus') != 'authoritative-confirmed':
              raise SystemExit('北部质控材料应处于权威确认关联状态')
          if not all(d.get('associationsByDataKey') for d in north.get('documents') or []):
              raise SystemExit('北部质控材料缺少权威任务关联')
          print(f'静态目录清单校验通过：{len(tree)} 项，版本 {version}；北部质控清单28份已权威关联')
          PY

          if grep -q '分片区收缴进度' regional-progress-dashboard.js; then
            echo '检测到旧的分片区标题，停止部署。'
            exit 1
          fi
          if grep -q '<span>中国农业大学</span>' page-enhancements-core.js; then
            echo '检测到重复的中国农业大学文字，停止部署。'
            exit 1
          fi
          if grep -q 'new MutationObserver' north-quality-upload-adapter.js north-quality-authority-bridge.js mobile-file-picker-fix.js; then
            echo '北部质控/手机文件选择脚本存在长期DOM观察器，停止部署。'
            exit 1
          fi
          echo '部署文件校验通过。'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
