name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # 多次连续提交时取消旧部署，避免旧版页面在新版之后才上线。
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            index.html
            upload-config.js
            assets
            data
            replies
          sparse-checkout-cone-mode: false

      - name: Validate dashboard and upload frontend
        shell: bash
        run: |
          set -euo pipefail
          grep -q "calculateDashboardStats(dataKey)" index.html
          grep -q "var municipalCities" index.html
          grep -q "实际值必须命中主清单中的唯一任务单元" index.html
          grep -q 'upload-config.js' index.html
          grep -q 'SOIL_UPLOAD_API_URL' index.html
          test -f upload-config.js
          if grep -q "已有数据（从 tabData 统计" index.html; then
            echo "旧版直接计数逻辑仍然存在，停止部署。"
            exit 1
          fi
          if grep -q "getGitHubToken" index.html; then
            echo "前端仍包含 Token 输入逻辑，停止部署。"
            exit 1
          fi
          echo "统计与 Worker 上传前端校验通过。"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
