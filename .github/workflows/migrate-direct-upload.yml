name: One-time restore direct GitHub upload

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-direct-upload.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make direct GitHub upload primary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          replacement = r'''function getDirectGitHubToken() {
            var token = String(window.SOIL_GITHUB_UPLOAD_TOKEN || '').trim();
            if (!token || token === 'REPLACE_WITH_NEW_FINE_GRAINED_TOKEN') return '';
            return token;
          }

          function getUploadApiUrl() {
            return String(window.SOIL_UPLOAD_API_URL || '').trim();
          }

          function completeUpload(uploadKey, newFileName, time, file, progressEl) {
            updateUploadProgress(progressEl, 100, file.size, 'success');
            setTimeout(function() {
              replyIndex[uploadKey] = { file: newFileName, time: time };
              refreshAllTabs();
              showToast('上传成功！GitHub Pages 正在自动更新，请稍后刷新查看。');
            }, 600);
          }

          function failUpload(progressEl, file, message) {
            var errMsg = '上传失败: ' + message;
            updateUploadProgress(progressEl, 0, file.size, 'error', errMsg);
            showToast(errMsg, true);
            removeUploadProgress(progressEl, 5000);
          }

          function uploadViaWorker(context) {
            var uploadApiUrl = getUploadApiUrl();
            if (!uploadApiUrl) {
              failUpload(context.progressEl, context.file, 'GitHub 直传失败，备用上传服务尚未配置');
              return;
            }

            var form = new FormData();
            form.append('file', context.file, context.file.name);
            form.append('key', context.uploadKey);
            form.append('city', context.uploadCity);
            form.append('unit', context.uploadUnit);
            form.append('district', context.uploadDistrict);

            var xhr = new XMLHttpRequest();
            xhr.open('POST', uploadApiUrl, true);
            xhr.timeout = 180000;

            xhr.upload.addEventListener('progress', function(evt) {
              if (evt.lengthComputable) {
                updateUploadProgress(context.progressEl, Math.round((evt.loaded / evt.total) * 100), context.file.size);
              }
            });

            xhr.onreadystatechange = function() {
              if (xhr.readyState !== 4) return;
              var result = {};
              try { result = JSON.parse(xhr.responseText || '{}'); } catch(ex) {}
              if (xhr.status >= 200 && xhr.status < 300 && result.ok) {
                completeUpload(context.uploadKey, result.file, result.time || getNow(), context.file, context.progressEl);
              } else {
                failUpload(context.progressEl, context.file, result.message || ('备用服务返回 HTTP ' + xhr.status));
              }
            };

            xhr.onerror = function() {
              failUpload(context.progressEl, context.file, '备用上传服务网络错误');
            };
            xhr.ontimeout = function() {
              failUpload(context.progressEl, context.file, '备用上传服务超时');
            };
            xhr.send(form);
          }

          function uploadDirectToGitHub(context, token) {
            var reader = new FileReader();
            reader.onerror = function() {
              failUpload(context.progressEl, context.file, '无法读取本地文件');
            };
            reader.onload = function(e) {
              var base64 = String(e.target.result || '').split(',')[1] || '';
              if (!base64) {
                failUpload(context.progressEl, context.file, '文件编码失败');
                return;
              }

              var extension = (context.file.name.split('.').pop() || '').toLowerCase();
              var time = getNow();
              var newFileName = context.uploadKey + '_整改答复_' + time + '.' + extension;
              var url = 'https://api.github.com/repos/1337816143/soil-type-mapping-inventory/contents/replies/' + encodeURIComponent(newFileName);
              var body = JSON.stringify({
                message: '整改答复: ' + context.uploadKey,
                content: base64,
                branch: 'main'
              });

              var xhr = new XMLHttpRequest();
              xhr.open('PUT', url, true);
              xhr.timeout = 180000;
              xhr.setRequestHeader('Authorization', 'Bearer ' + token);
              xhr.setRequestHeader('Accept', 'application/vnd.github+json');
              xhr.setRequestHeader('X-GitHub-Api-Version', '2022-11-28');
              xhr.setRequestHeader('Content-Type', 'application/json');

              xhr.upload.addEventListener('progress', function(evt) {
                if (evt.lengthComputable) {
                  updateUploadProgress(context.progressEl, Math.round((evt.loaded / evt.total) * 100), context.file.size);
                }
              });

              xhr.onreadystatechange = function() {
                if (xhr.readyState !== 4) return;
                if (xhr.status >= 200 && xhr.status < 300) {
                  completeUpload(context.uploadKey, newFileName, time, context.file, context.progressEl);
                  return;
                }

                var result = {};
                try { result = JSON.parse(xhr.responseText || '{}'); } catch(ex) {}
                var message = result.message || ('GitHub 返回 HTTP ' + xhr.status);
                if (getUploadApiUrl()) {
                  showToast('GitHub 直传失败，正在尝试备用上传服务…', true);
                  uploadViaWorker(context);
                } else {
                  failUpload(context.progressEl, context.file, message);
                }
              };

              xhr.onerror = function() {
                if (getUploadApiUrl()) {
                  showToast('GitHub 直传网络错误，正在尝试备用上传服务…', true);
                  uploadViaWorker(context);
                } else {
                  failUpload(context.progressEl, context.file, '连接 GitHub 失败');
                }
              };
              xhr.ontimeout = function() {
                if (getUploadApiUrl()) uploadViaWorker(context);
                else failUpload(context.progressEl, context.file, '连接 GitHub 超时');
              };
              xhr.send(body);
            };
            reader.readAsDataURL(context.file);
          }

          function confirmUploadFile() {
            if (!selectedFile || !currentUpload) return;

            var context = {
              uploadKey: currentUpload.key,
              uploadCity: currentUpload.city,
              uploadUnit: currentUpload.unit,
              uploadDistrict: currentUpload.district,
              file: selectedFile,
              progressEl: null
            };

            closeUploadModal();
            context.progressEl = showUploadProgress(context.uploadKey, context.uploadDistrict, context.file);

            var token = getDirectGitHubToken();
            if (token) {
              uploadDirectToGitHub(context, token);
            } else if (getUploadApiUrl()) {
              uploadViaWorker(context);
            } else {
              failUpload(context.progressEl, context.file, '上传凭证与备用服务均未配置');
            }
          }

          // ========== 进度条管理 =========='''

          pattern = re.compile(r'function getUploadApiUrl\(\) \{.*?// ========== 进度条管理 ==========', re.S)
          text, count = pattern.subn(lambda _: replacement, text)
          assert count == 1, f'上传逻辑替换次数异常: {count}'

          assert text != original, 'index.html 没有发生变化'
          assert 'getDirectGitHubToken' in text
          assert 'uploadDirectToGitHub' in text
          assert "xhr.open('PUT', url, true)" in text
          assert 'getGitHubToken' not in text
          assert 'window.prompt' not in text

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          inline = [script for script in scripts if script.strip()]
          assert inline, '未找到内联脚本'
          Path('/tmp/index-inline.js').write_text(inline[-1], encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          grep -q 'SOIL_GITHUB_UPLOAD_TOKEN' upload-config.js
          grep -q 'getDirectGitHubToken' index.html
          grep -q "xhr.open('PUT', url, true)" index.html
          if grep -q 'window.prompt' index.html; then
            echo '仍存在 Token 输入弹窗'
            exit 1
          fi

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/migrate-direct-upload.yml
          git config user.name "direct-upload-migration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/migrate-direct-upload.yml
          git commit -m "feat: restore direct GitHub uploads"
          git push origin HEAD:main
