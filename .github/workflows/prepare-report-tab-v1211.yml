name: Prepare report tab v1211
on:
  push:
    branches: [feat/report-family-v1.2.11]
    paths: [.github/workflows/prepare-report-tab-v1211.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply locally checked source changes
        run: |
          set -euo pipefail
          python3 .github/apply-report-tab.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          expected={
            'dashboard-extension.js':'cfe2bf634d852041c6726c49df5064c0520d1ee8489ce93a8d6c7437dbdb671c',
            'admin-auto-classifier.js':'12ebcc7d1d7337a5b154efe2af6a7c7fa0421cf341ae32aa32bdd4b68f7c5842',
            'page-enhancements-core.js':'d5984d3b1c17b0ae1b0f0a36fc8c6b291bed13c3d5d8377856af62ea922d0005',
            'hybrid-staged-upload.js':'efde8c7c04c8a5ee667063b3cf2fc1d6620ac7c0f41f97dcc85aee14f19eb68b',
            'scripts/check-report-tab-ui.py':'cb62af7d8cc02957accd5e787aede0f842b534529736060eacce603fe4b92035',
            'scripts/validate-report-tab.js':'bd7ffd61d303de1804379e350928e2237c19b9190d6a3293363bf72845750ea8',
            'scripts/glass-ui-checks.py':'c0a9941238854c1bc76dbd6f96a74725591b6e90c96f835b0ed93860e9750de4'}
          for path,digest in expected.items():
            assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          allowed={'CHANGELOG.md','MAINTENANCE_RULES.md','VERSION','admin-auto-classifier.js','app-release-ui.js','app-version-guard.js','dashboard-extension.js','docs/QUALITY_UPLOAD_NAMING.md','hybrid-staged-upload.js','index.html','page-enhancements-core.js','page-enhancements.js','scripts/glass-ui-checks.py','scripts/test-assignment-index.py','scripts/test-workspace-browser.py','scripts/validate-auto-import-classifier.js','upload-config.js'}
          changed=set(subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0'))-{''}
          assert changed<=allowed,changed-allowed
          print('Locally tested checksums and source boundaries verified')
          PY
          node --check admin-auto-classifier.js
          node --check dashboard-extension.js
          node --check page-enhancements-core.js
          node --check hybrid-staged-upload.js
          python3 -m py_compile scripts/check-report-tab-ui.py scripts/glass-ui-checks.py
          node scripts/validate-project.js
          node scripts/validate-auto-import-classifier.js
          node scripts/validate-workspace.js
          git diff --quiet -- task-unit-mappings.js data replies assets work-records.js work-records-core.js
      - name: Commit feature source only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/report-family-v1.2.11'
          git rm .github/apply-report-tab.py
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: v1.2.11 overall work and data report tab'
          git push origin HEAD:feat/report-family-v1.2.11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-tab-matching-results
          path: test-artifacts/*.json
          retention-days: 5
