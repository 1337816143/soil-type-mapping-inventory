name: Test reference group order

on:
  push:
    branches: [fix-reference-group-order]
    paths:
      - '.github/workflows/test-reference-groups.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-reference-group-order
          fetch-depth: 0

      - name: Install DOM test dependency
        run: npm install --no-save --no-package-lock jsdom@24

      - name: Validate reference page DOM
        shell: bash
        run: |
          set -euo pipefail
          node --check reference-library.js
          node --check page-enhancements.js
          node --check upload-config.js
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/deploy.yml')"

          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const {JSDOM} = require('jsdom');

          const dom = new JSDOM('<!doctype html><html><head></head><body><header><div class="tabs"><div class="tab active" data-tab="soilType">土壤类型图</div></div></header><div class="container"><div id="missingBanner"></div></div></body></html>', {
            runScripts:'outside-only',
            url:'https://example.test/'
          });
          const window = dom.window;
          const context = dom.getInternalVMContext();
          Object.defineProperty(window.document, 'readyState', {value:'complete', configurable:true});
          window.fetch = () => Promise.resolve({ok:true, text:() => Promise.resolve('{}')});
          window.openSoilAdminImport = () => {};

          vm.runInContext(fs.readFileSync('reference-library.js', 'utf8'), context);

          const root = 'reference-files/third-soil-survey';
          window.SoilRepoAdmin.loadTree = () => Promise.resolve([
            {type:'blob', path:root + '/三普成果编制及质量控制主要参考资料/土壤类型图三普成果编制及质控参考资料/type.pdf', size:1200},
            {type:'blob', path:root + '/三普成果编制及质量控制主要参考资料/土壤属性图-三普成果编制及质量控制主要参考资料/attr.pdf', size:2200},
            {type:'blob', path:root + '/三普成果编制及质量控制主要参考资料/土壤退化与障碍分析/deg.pdf', size:3200},
            {type:'blob', path:root + '/三普成果编制及质量控制主要参考资料/补充资料/extra.pdf', size:4200}
          ]);

          const tab = window.document.querySelector('[data-tab="references"]');
          if (!tab) throw new Error('参考文件标签未创建');
          tab.dispatchEvent(new window.MouseEvent('click', {bubbles:true, cancelable:true}));

          setTimeout(() => {
            const pageTitle = window.document.querySelector('.ref-page-title');
            if (!pageTitle || pageTitle.textContent.trim() !== '三普成果编制及质控参考资料') {
              throw new Error('左上角标题不正确');
            }

            const groups = Array.from(window.document.querySelectorAll('.ref-cat'));
            const names = groups.map(group => group.querySelector('summary span').textContent.trim());
            const expected = [
              '土壤类型图','土壤属性图','耕地质量等级评价','土壤退化与障碍分析',
              '土特产品适宜性评价','土壤农业利用适宜性评价','土地资源评价与利用报告','补充资料'
            ];
            if (JSON.stringify(names) !== JSON.stringify(expected)) {
              throw new Error('分组顺序错误：' + JSON.stringify(names));
            }
            if (names.some(name => name.includes('三普成果编制及质控参考资料') || name.includes('质量控制主要参考资料'))) {
              throw new Error('分组名称仍包含资料后缀');
            }

            const counts = Object.fromEntries(groups.map(group => [
              group.querySelector('summary span').textContent.trim(),
              group.querySelector('.ref-count').textContent.trim()
            ]));
            if (counts['土壤类型图'] !== '1 个文件' || counts['土壤属性图'] !== '1 个文件' ||
                counts['耕地质量等级评价'] !== '0 个文件' || counts['土特产品适宜性评价'] !== '0 个文件') {
              throw new Error('文件数量或空组统计错误：' + JSON.stringify(counts));
            }

            ['耕地质量等级评价','土特产品适宜性评价','土壤农业利用适宜性评价','土地资源评价与利用报告'].forEach(name => {
              const group = groups.find(item => item.querySelector('summary span').textContent.trim() === name);
              if (!group || !group.querySelector('.ref-empty') || group.querySelector('.ref-empty').textContent.trim() !== '暂无参考文件') {
                throw new Error(name + '未显示空分组提示');
              }
            });

            if (!groups[0].open || !groups[1].open || !groups[2].open || groups[3].open) {
              throw new Error('默认展开状态不符合前三组展开、其余收起');
            }

            fs.writeFileSync('reference-group-test-result.txt', 'reference group DOM validation passed\n');
          }, 0);
          NODE

          for i in $(seq 1 20); do
            test -f reference-group-test-result.txt && break
            sleep 1
          done
          test -f reference-group-test-result.txt

      - name: Record successful validation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference-group-test-result.txt
          git commit -m "test: record reference group validation"
          git push origin HEAD:fix-reference-group-order
