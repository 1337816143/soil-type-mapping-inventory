name: Prepare upload recognition v1216
on:
  push:
    branches: [fix/upload-recognition-v1.2.16]
    paths: [.github/workflows/prepare-upload-v1216.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply bounded source changes and verify
        run: |
          set -euo pipefail
          python3 .github/apply-upload-v1216.py
          node --check admin-auto-classifier.js
          node --check admin-import-v2.js
          node --check hybrid-staged-upload.js
          python3 -m py_compile scripts/check-upload-recognition-ui.py scripts/test-live-workspace.py
          node scripts/validate-project.js
          node scripts/validate-upload-entry.js
          node scripts/validate-auto-import-classifier.js
          node scripts/validate-workspace.js
          git diff --quiet -- task-unit-mappings.js data replies assets work-records.js work-records-core.js regional-progress-dashboard.js
          python3 - <<'PY'
          import subprocess
          allowed={'CHANGELOG.md','MAINTENANCE_RULES.md','VERSION','admin-auto-classifier.js','admin-import-v2.js','app-release-ui.js','app-version-guard.js','docs/QUALITY_UPLOAD_NAMING.md','hybrid-staged-upload.js','index.html','page-enhancements.js','scripts/test-assignment-index.py','scripts/test-live-workspace.py','scripts/test-workspace-browser.py','scripts/validate-auto-import-classifier.js','upload-config.js'}
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          assert changed<=allowed,changed-allowed
          PY
      - name: Commit ordinary source files only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/upload-recognition-v1.2.16'
          git rm .github/apply-upload-v1216.py .github/integrate-upload-v1216.py
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: v1.2.16 report category, attribute aliases and explicit upload validation'
          git push origin HEAD:fix/upload-recognition-v1.2.16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upload-recognition-node-results
          path: test-artifacts/
          retention-days: 5
