name: One-time migrate frontend upload

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-worker-upload.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace browser Token upload with Worker upload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          if '<script src="./upload-config.js"></script>' not in text:
              marker = '<script>\n// ========== 中标单位底层数据（全量区县清单）=========='
              replacement = '<script src="./upload-config.js"></script>\n<script>\n// ========== 中标单位底层数据（全量区县清单）=========='
              assert marker in text, '找不到主脚本插入位置'
              text = text.replace(marker, replacement, 1)

          text = text.replace('if (file.size > 50 * 1024 * 1024) {', 'if (file.size > 20 * 1024 * 1024) {')
          text = text.replace("showToast('文件不能超过 50 MB', true);", "showToast('文件不能超过 20 MB', true);")

          new_upload = r'''function getUploadApiUrl() {
            return String(window.SOIL_UPLOAD_API_URL || '').trim();
          }

          function confirmUploadFile() {
            if (!selectedFile || !currentUpload) return;

            var uploadApiUrl = getUploadApiUrl();
            if (!uploadApiUrl) {
              showToast('上传服务尚未完成部署，请联系管理员配置 Cloudflare Worker', true);
              return;
            }

            // 先保存所有需要的值，因为 closeUploadModal 会清空 currentUpload 和 selectedFile
            var uploadKey = currentUpload.key;
            var uploadCity = currentUpload.city;
            var uploadUnit = currentUpload.unit;
            var uploadDistrict = currentUpload.district;
            var file = selectedFile;

            // 关闭弹窗，在按钮位置显示进度条
            closeUploadModal();
            var progressEl = showUploadProgress(uploadKey, uploadDistrict, file);

            var form = new FormData();
            form.append('file', file, file.name);
            form.append('key', uploadKey);
            form.append('city', uploadCity);
            form.append('unit', uploadUnit);
            form.append('district', uploadDistrict);

            var xhr = new XMLHttpRequest();
            xhr.open('POST', uploadApiUrl, true);

            // 浏览器到 Worker 的真实上传进度
            xhr.upload.addEventListener('progress', function(evt) {
              if (evt.lengthComputable) {
                var pct = Math.round((evt.loaded / evt.total) * 100);
                updateUploadProgress(progressEl, pct, file.size);
              }
            });

            xhr.onreadystatechange = function() {
              if (xhr.readyState !== 4) return;

              var result = {};
              try { result = JSON.parse(xhr.responseText || '{}'); } catch(ex) {}

              if (xhr.status >= 200 && xhr.status < 300 && result.ok) {
                var newFileName = result.file;
                var time = result.time || getNow();
                updateUploadProgress(progressEl, 100, file.size, 'success');
                setTimeout(function() {
                  replyIndex[uploadKey] = { file: newFileName, time: time };
                  refreshAllTabs();
                  showToast('上传成功！页面正在自动更新，请稍后刷新查看。');
                }, 600);
              } else {
                var errMsg = '上传失败: ' + (result.message || ('服务返回 HTTP ' + xhr.status));
                updateUploadProgress(progressEl, 0, file.size, 'error', errMsg);
                showToast(errMsg, true);
                removeUploadProgress(progressEl, 5000);
              }
            };

            xhr.onerror = function() {
              updateUploadProgress(progressEl, 0, file.size, 'error', '网络错误或上传服务不可用');
              showToast('上传失败: 网络错误或上传服务不可用', true);
              removeUploadProgress(progressEl, 5000);
            };

            xhr.ontimeout = function() {
              updateUploadProgress(progressEl, 0, file.size, 'error', '上传超时');
              showToast('上传失败: 上传超时，请重试', true);
              removeUploadProgress(progressEl, 5000);
            };

            xhr.timeout = 180000;
            xhr.send(form);
          }

          // ========== 进度条管理 =========='''

          pattern = re.compile(r'function confirmUploadFile\(\) \{.*?// ========== 进度条管理 ==========', re.S)
          text, count = pattern.subn(lambda _: new_upload, text)
          assert count == 1, f'上传函数替换次数异常: {count}'

          token_pattern = re.compile(r'\nfunction getGitHubToken\(\) \{.*?\n\}\n\nfunction refreshAllTabs', re.S)
          text, count = token_pattern.subn('\nfunction refreshAllTabs', text)
          assert count == 1, f'Token 函数删除次数异常: {count}'

          assert text != original, 'index.html 没有发生变化'
          assert '<script src="./upload-config.js"></script>' in text
          assert 'window.SOIL_UPLOAD_API_URL' in text
          assert 'new FormData()' in text
          assert "xhr.open('POST', uploadApiUrl" in text
          assert 'getGitHubToken' not in text
          assert 'githubUploadToken' not in text
          assert "file.size > 20 * 1024 * 1024" in text

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          inline = [script for script in scripts if script.strip()]
          assert inline, '未找到内联脚本'
          Path('/tmp/index-inline.js').write_text(inline[-1], encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          node --check worker/src/index.js
          grep -q 'SOIL_UPLOAD_API_URL' upload-config.js

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/migrate-worker-upload.yml
          git config user.name "upload-migration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/migrate-worker-upload.yml
          git commit -m "feat: route uploads through Cloudflare Worker"
          git push origin HEAD:main
