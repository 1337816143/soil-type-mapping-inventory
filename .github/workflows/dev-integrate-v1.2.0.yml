name: Integrate v1.2.0 modules
on:
  push:
    branches: [feat/glass-work-records-rounds-v1.2.0]
    paths: [.github/workflows/dev-integrate-v1.2.0.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact integration without modifying existing credential bytes
        run: |
          python3 scripts/apply-v1.2.0-integration.py
          git diff --check
          rm scripts/apply-v1.2.0-integration.py scripts/v1.2.0-release-notes.txt
          rm .github/workflows/dev-source-snapshot.yml .github/workflows/dev-integrate-v1.2.0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat: integrate v1.2.0 work records glass UI and QC rounds'
          git push origin HEAD:feat/glass-work-records-rounds-v1.2.0
