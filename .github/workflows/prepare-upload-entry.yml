name: Prepare upload entry repair
on:
  push:
    branches: [fix/upload-auth-v1.2.12]
    paths: [.github/workflows/prepare-upload-entry.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply UI-only changes
        run: |
          set -euo pipefail
          python3 .github/apply-upload-entry-v1212.py
          printf '\nrequire("./validate-upload-entry.js");\n' >> scripts/validate-project.js
          node --check assets/admin-input-guard.js
          node --check pptx-auto-split.js
          node --check hybrid-staged-upload.js
          node --check admin-import-v2.js
          node scripts/validate-project.js
          node scripts/validate-admin-upload-transport.js
          node scripts/validate-admin-progress-wrapper.js
          node scripts/validate-reference-upload-isolation.js
          node scripts/validate-auto-import-classifier.js
          node scripts/validate-workspace.js
          git diff --quiet -- task-unit-mappings.js upload-auth-reply-batch.js reference-upload.js admin-quality-ui.js data replies
      - name: Commit feature source
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/upload-auth-v1.2.12'
          git rm .github/apply-upload-entry-v1212.py
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: v1.2.12 preserve prepared uploads and active administrator input'
          git push origin HEAD:fix/upload-auth-v1.2.12
