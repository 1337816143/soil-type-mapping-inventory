name: Improve city result layout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/improve-city-results-layout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update master list and city rendering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          cangzhou_anchor = '    {unit:"中友四达（北京）科技有限公司",contact:"王昊昕",phone:"18945618300",districts:["泊头市","吴桥县","东光县"]}'
          cangzhou_new = cangzhou_anchor + ',\n    {unit:"沧州华江工程勘察设计有限公司",contact:"",phone:"",districts:["合并区"]}'
          if '沧州华江工程勘察设计有限公司' not in text:
              assert cangzhou_anchor in text, '找不到沧州市主清单插入位置'
              text = text.replace(cangzhou_anchor, cangzhou_new, 1)

          merge_anchor = "  '邢台市': ['襄都区'],"
          if "'沧州市': ['运河区','新华区']" not in text:
              assert merge_anchor in text, '找不到合并区映射插入位置'
              text = text.replace(merge_anchor, merge_anchor + "\n  '沧州市': ['运河区','新华区'],", 1)

          css_anchor = '.reply-cell{min-width:120px}'
          css_replacement = '''.reply-cell{min-width:300px}
          .reply-list{display:flex;flex-wrap:wrap;align-items:center;gap:7px 14px}
          .reply-item{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
          .reply-label{font-size:.76rem;color:var(--muted);font-weight:500}
          .reply-label.municipal{color:#1e3a8a;font-weight:700}
          .district-link.municipal-link,.district-group.municipal .group-label{background:#1e40af;color:#fff;border-color:#1e3a8a;font-weight:600}
          .district-link.municipal-link:hover,.district-group.municipal .group-label:hover{background:#172554;color:#fff;border-color:#172554}'''
          if css_anchor in text:
              text = text.replace(css_anchor, css_replacement, 1)
          else:
              assert '.reply-list{' in text, '找不到整改答复 CSS 插入位置'

          new_render = r'''function renderCities(cities, dataKey) {
            var dashboardStats = calculateDashboardStats(dataKey);
            var totalUnits = dashboardStats.totalUnits;
            var totalDistricts = dashboardStats.totalDistricts;
            var totalMunicipal = dashboardStats.totalMunicipal;
            var expCities = dashboardStats.expCities;
            var expUnits = dashboardStats.expUnits;
            var expDistricts = dashboardStats.expDistricts;
            var expMunicipal = dashboardStats.expMunicipal;

            var html = '<div class="summary-bar">';
            html += '<div class="summary-card"><div class="num">' + totalDistricts + ' / ' + expDistricts + '</div><div class="label">区县（含合并区）</div></div>';
            html += '<div class="summary-card"><div class="num">' + totalMunicipal + ' / ' + expMunicipal + '</div><div class="label">市级</div></div>';
            html += '<div class="summary-card"><div class="num">' + totalUnits + ' / ' + expUnits + '</div><div class="label">作业单位</div></div>';
            html += '<div class="summary-card"><div class="num">' + (totalDistricts + totalMunicipal) + ' / ' + (expDistricts + expMunicipal) + '</div><div class="label">任务单元</div></div>';
            html += '</div>';

            cities.forEach(function(city) {
              var unitCount = 0;
              var districtCount = 0;
              var municipalCount = 0;
              city.units.forEach(function(unit) {
                var outcomes = unit.districts || [];
                if (outcomes.length > 0) unitCount++;
                outcomes.forEach(function(d) {
                  if (isMunicipalTask(d.label, city.name)) municipalCount++;
                  else districtCount++;
                });
              });

              var resultCount = districtCount + municipalCount;
              html += '<section class="city-section"><h2>' + city.name +
                ' <span class="badge">' + unitCount + ' 家单位 · ' + resultCount +
                ' 成果：' + municipalCount + ' 市级 | ' + districtCount +
                ' 区县（含合并区）</span></h2>';
              html += '<div class="table-wrap"><table><thead><tr><th>作业单位</th><th>成果</th><th>批次</th><th>整改答复</th></tr></thead><tbody>';

              city.units.forEach(function(unit) {
                var outcomes = unit.districts || [];
                if (outcomes.length === 0) return;
                var batches = [];
                outcomes.forEach(function(d) {
                  (d.docs || []).forEach(function(doc) {
                    if (batches.indexOf(doc.batch) < 0) batches.push(doc.batch);
                  });
                });

                html += '<tr><td>' + unit.name + '</td><td><div class="district-list">';
                outcomes.forEach(function(d) {
                  var municipal = isMunicipalTask(d.label, city.name);
                  var linkClass = 'district-link' + (municipal ? ' municipal-link' : '');
                  var docs = d.docs || [];
                  if (docs.length === 1) {
                    var url = BASE + '/' + docs[0].file;
                    html += '<a class="' + linkClass + '" href="' + url + '" target="_blank">' + d.label + ' ' + PDF_ICON + '</a>';
                  } else if (docs.length > 1) {
                    html += '<div class="district-group' + (municipal ? ' municipal' : '') + '"><span class="group-label">' + d.label + ' ▾</span><div class="doc-btns">';
                    docs.forEach(function(doc) {
                      var url = BASE + '/' + doc.file;
                      html += '<a class="doc-btn" href="' + url + '" target="_blank">' + PDF_ICON + ' ' + doc.batch + '</a>';
                    });
                    html += '</div></div>';
                  } else {
                    html += '<span class="' + linkClass + '">' + d.label + '</span>';
                  }
                });
                html += '</div></td><td>';
                batches.forEach(function(b) {
                  html += '<span class="batch-tag ' + (batchClass[b] || '') + '">' + b + '</span>';
                });
                html += '</td><td class="reply-cell"><div class="reply-list">';
                outcomes.forEach(function(d) {
                  var municipal = isMunicipalTask(d.label, city.name);
                  html += '<div class="reply-item"><span class="reply-label' + (municipal ? ' municipal' : '') + '">' + d.label + ':</span>' + renderReplyCell(city.name, unit.name, d.label) + '</div>';
                });
                html += '</div></td></tr>';
              });
              html += '</tbody></table></div></section>';
            });
            return html;
          }'''

          pattern = re.compile(r'function renderCities\(cities, dataKey\) \{.*?\n\}\n\nfor \(var key in tabData\)', re.S)
          text, count = pattern.subn(lambda _: new_render + '\n\nfor (var key in tabData)', text)
          assert count == 1, f'renderCities 替换次数异常: {count}'

          assert text != original
          assert text.count('沧州华江工程勘察设计有限公司') >= 1
          assert "'沧州市': ['运河区','新华区']" in text
          assert '成果：' in text
          assert 'municipal-link' in text
          assert 'class="reply-list"' in text
          assert 'municipalDocs' not in text
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript and statistics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          inline = [script for script in scripts if script.strip()]
          assert inline
          Path('/tmp/index-inline.js').write_text(inline[-1], encoding='utf-8')
          PY
          node --check /tmp/index-inline.js

          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const src = fs.readFileSync('index.html', 'utf8');
          const match = src.match(/var masterList = (\[[\s\S]*?\n\]);/);
          if (!match) throw new Error('masterList not found');
          const context = {};
          vm.createContext(context);
          vm.runInContext('var masterList = ' + match[1] + ';', context);
          const skipped = new Set(['承德市','保定市','张家口市','秦皇岛市','廊坊市','雄安新区','唐山市','定州市']);
          const municipalCities = new Set(['石家庄市','保定市','承德市','邢台市','沧州市','唐山市','衡水市','邯郸市','张家口市']);
          const isMunicipal = (label, city) => label.includes('市级') || label.includes('市本级') || (label === city && municipalCities.has(city));
          let cities = 0, districts = 0, municipal = 0, units = 0;
          for (const city of context.masterList) {
            if (skipped.has(city.city)) continue;
            cities++;
            for (const item of city.items) {
              let hasDistrict = false;
              for (const d of item.districts) {
                if (isMunicipal(d, city.city)) municipal++;
                else { districts++; hasDistrict = true; }
              }
              if (hasDistrict) units++;
            }
          }
          if (cities !== 6 || districts !== 74 || municipal !== 5 || districts + municipal !== 79 || units !== 28) {
            throw new Error(JSON.stringify({cities, districts, municipal, total: districts + municipal, units}));
          }
          console.log({cities, districts, municipal, total: districts + municipal, units});
          NODE

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/improve-city-results-layout.yml
          git config user.name "city-layout-migration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/improve-city-results-layout.yml
          git commit -m "feat: improve city result counts and layout"
          git push origin HEAD:main
