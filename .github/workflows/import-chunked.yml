name: Import hybrid staging branch

on:
  push:
    branches:
      - 'soil-upload-*'
    paths:
      - '.soil-upload/ready.json'

permissions:
  contents: write

concurrency:
  group: soil-hybrid-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate and restore staged files
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          ready_path = root / '.soil-upload' / 'ready.json'
          ready = json.loads(ready_path.read_text(encoding='utf-8'))
          if ready.get('schemaVersion') != 3:
              raise SystemExit('不支持的 ready 清单版本')

          manifest_rel = str(ready.get('manifestPath') or '')
          manifest_posix = PurePosixPath(manifest_rel)
          if not manifest_rel or manifest_posix.is_absolute() or '..' in manifest_posix.parts:
              raise SystemExit('manifestPath 非法')
          manifest_path = root / manifest_rel
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('schemaVersion') != 3:
              raise SystemExit('不支持的导入清单版本')
          if str(manifest.get('uploadId') or '') != str(ready.get('uploadId') or ''):
              raise SystemExit('uploadId 不一致')

          target_branch = str(manifest.get('targetBranch') or 'main').strip()
          if not target_branch or target_branch.startswith('-') or any(x in target_branch for x in ['..', '~', '^', ':', '?', '*', '[', '\\']):
              raise SystemExit('目标分支名称非法')

          direct_limit = int(manifest.get('singleBlobLimit') or 0)
          chunk_size = int(manifest.get('chunkSize') or 0)
          if direct_limit != 39 * 1024 * 1024 or chunk_size != 39 * 1024 * 1024:
              raise SystemExit('上传阈值配置不一致')

          files = manifest.get('files')
          if not isinstance(files, list) or not files:
              raise SystemExit('导入清单中没有文件')

          restored = Path('/tmp/soil-hybrid-restored')
          if restored.exists():
              shutil.rmtree(restored)
          restored.mkdir(parents=True)

          def validate_stage_path(raw):
              value = str(raw or '')
              posix = PurePosixPath(value)
              if not value.startswith('.soil-upload/') or posix.is_absolute() or '..' in posix.parts:
                  raise SystemExit(f'非法暂存路径：{value}')
              source = root / value
              if not source.is_file():
                  raise SystemExit(f'找不到暂存文件：{value}')
              return source

          for index, item in enumerate(sorted(files, key=lambda x: int(x.get('order') or 0)), start=1):
              storage = str(item.get('storage') or '')
              output = restored / f'{index:04d}.bin'
              actual = 0

              if storage == 'whole':
                  whole = item.get('whole')
                  if not isinstance(whole, dict):
                      raise SystemExit(f'整文件 {index} 缺少 whole 信息')
                  source = validate_stage_path(whole.get('path'))
                  expected = int(whole.get('size') or 0)
                  if expected > direct_limit:
                      raise SystemExit(f'整文件超过单 Blob 安全阈值：{item.get("originalName") or index}')
                  if source.stat().st_size != expected:
                      raise SystemExit(f'整文件大小不一致：{whole.get("path")}')
                  shutil.copy2(source, output)
                  actual = expected

              elif storage == 'chunked':
                  chunks = item.get('chunks')
                  if not isinstance(chunks, list) or len(chunks) < 2:
                      raise SystemExit(f'超限文件 {index} 的分块数量无效')
                  with output.open('wb') as destination:
                      for chunk in chunks:
                          source = validate_stage_path(chunk.get('path'))
                          expected = int(chunk.get('size') or 0)
                          if expected <= 0 or expected > chunk_size:
                              raise SystemExit(f'分块大小超出 39 MiB：{chunk.get("path")}')
                          if source.stat().st_size != expected:
                              raise SystemExit(f'分块大小不一致：{chunk.get("path")}')
                          with source.open('rb') as handle:
                              shutil.copyfileobj(handle, destination, length=1024 * 1024)
                          actual += expected
              else:
                  raise SystemExit(f'文件 {index} 的存储方式无效：{storage}')

              if actual != int(item.get('size') or -1):
                  raise SystemExit(f'文件大小校验失败：{item.get("originalName") or index}')
              expected_size = int(item.get('expectedSize') or 0)
              if expected_size and actual != expected_size:
                  raise SystemExit(f'登记表文件大小不匹配：{item.get("originalName") or index}')
              expected_sha = str(item.get('expectedSha256') or '').strip().lower()
              if expected_sha:
                  actual_sha = hashlib.sha256(output.read_bytes()).hexdigest()
                  if actual_sha != expected_sha:
                      raise SystemExit(f'登记表 SHA-256 校验失败：{item.get("originalName") or index}')
              if actual >= 100 * 1024 * 1024:
                  raise SystemExit(f'普通 Git 仓库不接受 100 MiB 及以上文件：{item.get("originalName") or index}')

          Path('/tmp/soil-hybrid-manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          Path('/tmp/soil-target-branch.txt').write_text(target_branch, encoding='utf-8')
          PY
          echo "target_branch=$(cat /tmp/soil-target-branch.txt)" >> "$GITHUB_OUTPUT"

      - name: Checkout target branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.manifest.outputs.target_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

      - name: Restore repository paths and index
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import shutil
          from pathlib import Path, PurePosixPath

          root = Path.cwd().resolve()
          restored = Path('/tmp/soil-hybrid-restored')
          manifest = json.loads(Path('/tmp/soil-hybrid-manifest.json').read_text(encoding='utf-8'))
          kind = manifest.get('kind')
          if kind not in {'reference', 'quality'}:
              raise SystemExit('导入类型无效')

          reference_root = str(manifest.get('referenceRoot') or 'reference-files/third-soil-survey').strip('/')
          index_path = str(manifest.get('indexPath') or 'data/admin-import-index.json').strip('/')
          assigned = set()
          quality_records = []

          def safe_target(raw):
              value = str(raw or '').replace('\\', '/').strip('/')
              path = PurePosixPath(value)
              if not value or path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'非法目标路径：{raw}')
              if kind == 'reference':
                  if value != reference_root and not value.startswith(reference_root + '/'):
                      raise SystemExit(f'参考资料越界：{value}')
              elif not value.startswith('data/质控意见反馈_管理员导入/'):
                  raise SystemExit(f'质控意见越界：{value}')
              return value

          def unique_path(value):
              target = root / value
              if value not in assigned and not target.exists():
                  assigned.add(value)
                  return value
              posix = PurePosixPath(value)
              parent = '' if str(posix.parent) == '.' else str(posix.parent) + '/'
              suffix = ''.join(posix.suffixes)
              name = posix.name[:-len(suffix)] if suffix else posix.name
              number = 2
              while True:
                  candidate = f'{parent}{name}_第{number}份{suffix}'
                  if candidate not in assigned and not (root / candidate).exists():
                      assigned.add(candidate)
                      return candidate
                  number += 1

          files = sorted(manifest['files'], key=lambda x: int(x.get('order') or 0))
          for index, item in enumerate(files, start=1):
              requested = safe_target(item.get('targetPath'))
              final_path = unique_path(requested)
              destination = root / final_path
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(restored / f'{index:04d}.bin', destination)

              quality = item.get('quality')
              if kind == 'quality' and isinstance(quality, dict):
                  common = {
                      'kind': 'quality-control',
                      'batch': str(quality.get('batch') or '管理员导入'),
                      'path': final_path,
                      'name': PurePosixPath(final_path).name,
                      'sourcePath': str(item.get('sourcePath') or ''),
                      'order': int(item.get('order') or 0),
                      'complete': bool(quality.get('complete')),
                      'uploadedAt': str(manifest.get('createdAt') or '')
                  }
                  data_keys = [str(x) for x in (quality.get('dataKeys') or []) if str(x)]
                  if not data_keys and str(quality.get('dataKey') or ''):
                      data_keys = [str(quality.get('dataKey'))]
                  if quality.get('shared'):
                      targets = [str(x) for x in (quality.get('targets') or []) if str(x)]
                      if not data_keys or not targets:
                          raise SystemExit(f'共享质控报告缺少 dataKeys/targets：{final_path}')
                      common.update({
                          'sharedSource': True,
                          'dataKeys': data_keys,
                          'targets': targets
                      })
                      quality_records.append(common)
                  else:
                      if not data_keys:
                          raise SystemExit(f'质控文件未识别成果类型：{final_path}')
                      for data_key in data_keys:
                          row = dict(common)
                          row.update({
                              'dataKey': data_key,
                              'city': str(quality.get('city') or ''),
                              'unit': str(quality.get('unit') or ''),
                              'district': str(quality.get('district') or '')
                          })
                          quality_records.append(row)

          if kind == 'quality':
              target_index = root / index_path
              target_index.parent.mkdir(parents=True, exist_ok=True)
              try:
                  current = json.loads(target_index.read_text(encoding='utf-8')) if target_index.exists() else []
              except Exception:
                  current = []
              if not isinstance(current, list):
                  current = []
              incoming = {entry['path'] for entry in quality_records}
              merged = [entry for entry in current if isinstance(entry, dict) and entry.get('path') not in incoming]
              merged.extend(quality_records)
              target_index.write_text(json.dumps(merged, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit imported files once
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.manifest.outputs.target_branch }}
          UPLOAD_ID: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo '没有需要提交的文件。'
          else
            git commit -m "docs: import staged files ${UPLOAD_ID#soil-upload-}"
            git push origin "HEAD:$TARGET_BRANCH"
          fi

      - name: Delete staging branch
        if: success()
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git push origin --delete "$SOURCE_BRANCH" || true