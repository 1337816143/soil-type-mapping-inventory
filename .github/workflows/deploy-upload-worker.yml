name: Deploy upload Worker

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upload-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_UPLOAD_TOKEN: ${{ secrets.GITHUB_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "缺少 CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "缺少 CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GITHUB_UPLOAD_TOKEN" || { echo "缺少 GITHUB_UPLOAD_TOKEN"; exit 1; }

      - name: Validate Worker source
        run: node --check worker/src/index.js

      - name: Deploy Worker with encrypted GitHub secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_UPLOAD_TOKEN: ${{ secrets.GITHUB_UPLOAD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('worker/.secrets.json', JSON.stringify({
            GITHUB_UPLOAD_TOKEN: process.env.GITHUB_UPLOAD_TOKEN
          }), { mode: 0o600 });
          NODE
          npx --yes wrangler@4 deploy \
            --config worker/wrangler.toml \
            --secrets-file worker/.secrets.json
          rm -f worker/.secrets.json

      - name: Resolve public Worker URL
        id: worker_url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          script_name="soil-type-mapping-upload"

          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${script_name}/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"enabled":true,"previews_enabled":false}' >/dev/null

          response="$(curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLLARE_API_TOKEN}")"
          subdomain="$(printf '%s' "$response" | jq -r '.result.subdomain // empty')"
          test -n "$subdomain" || { echo "Cloudflare 账户尚未设置 workers.dev 子域名"; exit 1; }

          worker_url="https://${script_name}.${subdomain}.workers.dev"
          echo "base_url=${worker_url}" >> "$GITHUB_OUTPUT"
          echo "upload_url=${worker_url}/upload" >> "$GITHUB_OUTPUT"

      - name: Verify Worker health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${{ steps.worker_url.outputs.base_url }}/health"; then
              exit 0
            fi
            sleep 3
          done
          echo "Worker 已部署，但健康检查暂未通过。"
          exit 1

      - name: Publish frontend upload endpoint
        shell: bash
        run: |
          set -euo pipefail
          cat > upload-config.js <<EOF_CONFIG
          // 此文件由 Deploy upload Worker 工作流自动生成，请勿写入任何密钥。
          window.SOIL_UPLOAD_API_URL = '${{ steps.worker_url.outputs.upload_url }}';
          EOF_CONFIG

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upload-config.js
          if git diff --cached --quiet; then
            echo "上传接口地址未变化。"
          else
            git commit -m "chore: configure upload worker endpoint"
            git push origin HEAD:main
          fi

      - name: Redeploy GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Remove temporary secret file
        if: always()
        run: rm -f worker/.secrets.json
