var UPLOAD_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';

var BASE = './data';
var tabData = { soilType: soilTypeData, soilAttr: soilAttrData, farmland: farmlandData };
var batchClass = {'第一批':'batch-1','第二批':'batch-2','第二批补充':'batch-2','第三批':'batch-3'};

var currentUpload = null; // {tab, city, unit, district, key}
var selectedFile = null;

function getReplyKey(city, unit, district) {
  return city + '_' + unit + '_' + district;
}

function getNow() {
  var d = new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  var h = String(d.getHours()).padStart(2,'0');
  var mi = String(d.getMinutes()).padStart(2,'0');
  return y + m + day + h + mi;
}

function formatTime(t) {
  if (!t || t.length < 8) return t;
  return t.substring(0,4) + '-' + t.substring(4,6) + '-' + t.substring(6,8) + ' ' + t.substring(8,10) + ':' + t.substring(10,12);
}

function renderReplyCell(city, unit, district) {
  var key = getReplyKey(city, unit, district);
  var reply = replyIndex[key];
  if (reply) {
    return '<div class="reply-file">' +
      '<a href="' + REPLY_BASE + '/' + reply.file + '" target="_blank">' + PDF_ICON + ' 查看</a>' +
      '<span class="time">' + formatTime(reply.time) + '</span>' +
      '<span class="replace-btn" data-key="' + key + '" data-city="' + city + '" data-unit="' + unit + '" data-district="' + district + '">替换</span>' +
      '</div>';
  }
  return '<div class="upload-btn" data-key="' + key + '" data-city="' + city + '" data-unit="' + unit + '" data-district="' + district + '">' +
    UPLOAD_ICON + ' 上传</div>';
}

function renderCities(cities) {
  var totalUnits = 0, totalDistricts = 0;
  cities.forEach(function(city) {
    totalUnits += city.units.length;
    city.units.forEach(function(u) {
      u.districts.forEach(function(d) {
        if(d.label.indexOf('市级') < 0) totalDistricts++;
      });
    });
  });

  var html = '<div class="summary-bar">';
  html += '<div class="summary-card"><div class="num">' + cities.length + '</div><div class="label">市</div></div>';
  html += '<div class="summary-card"><div class="num">' + totalUnits + '</div><div class="label">作业单位</div></div>';
  html += '<div class="summary-card"><div class="num">' + totalDistricts + '</div><div class="label">区县（含合并区）</div></div>';
  html += '<div class="summary-card"><div class="num">3</div><div class="label">批次</div></div>';
  html += '</div>';

  cities.forEach(function(city) {
    var unitCount = city.units.length;
    var distCount = 0;
    city.units.forEach(function(u) {
      u.districts.forEach(function(d) {
        if(d.label.indexOf('市级') < 0) distCount++;
      });
    });
    html += '<section class="city-section"><h2>' + city.name + ' <span class="badge">' + unitCount + ' 家单位 · ' + distCount + ' 区县</span></h2>';
    html += '<div class="table-wrap"><table><thead><tr><th>作业单位</th><th>区县</th><th>批次</th><th>整改答复</th></tr></thead><tbody>';
    city.units.forEach(function(unit) {
      var batches = [];
      unit.districts.forEach(function(d) {
        d.docs.forEach(function(doc) {
          if(batches.indexOf(doc.batch) < 0) batches.push(doc.batch);
        });
      });
      html += '<tr><td>' + unit.name + '</td><td><div class="district-list">';
      unit.districts.forEach(function(d) {
        if(d.docs.length === 1) {
          var url = BASE + '/' + d.docs[0].file;
          html += '<a class="district-link" href="' + url + '" target="_blank">' + d.label + ' ' + PDF_ICON + '</a>';
        } else {
          html += '<div class="district-group"><span class="group-label">' + d.label + ' ▾</span><div class="doc-btns">';
          d.docs.forEach(function(doc) {
            var url = BASE + '/' + doc.file;
            html += '<a class="doc-btn" href="' + url + '" target="_blank">' + PDF_ICON + ' ' + doc.batch + '</a>';
          });
          html += '</div></div>';
        }
      });
      html += '</div></td><td>';
      batches.forEach(function(b) { html += '<span class="batch-tag ' + (batchClass[b]||'') + '">' + b + '</span>'; });
      html += '</td><td class="reply-cell">';
      unit.districts.forEach(function(d) {
        if(d.label.indexOf('市级') < 0) {
          html += '<div style="margin-bottom:4px">' + d.label + ': ' + renderReplyCell(city.name, unit.name, d.label) + '</div>';
        }
      });
      html += '</td></tr>';
    });
    html += '</tbody></table></div></section>';
  });
  return html;
}

for (var key in tabData) {
  var el = document.querySelector('#tab-' + key + ' .content');
  if (el) el.innerHTML = renderCities(tabData[key]);
}

// 标签切换
document.querySelectorAll('.tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    var tabKey = this.getAttribute('data-tab');
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
    this.classList.add('active');
    document.getElementById('tab-' + tabKey).classList.add('active');
    document.querySelectorAll('.doc-btns.open').forEach(function(d) { d.classList.remove('open'); });
  });
});

// 下拉菜单点击触发
document.addEventListener('click', function(e) {
  var label = e.target.closest('.group-label');
  if (label) {
    e.stopPropagation();
    var group = label.parentElement;
    var dropdown = group.querySelector('.doc-btns');
    var isOpen = dropdown.classList.contains('open');
    document.querySelectorAll('.doc-btns.open').forEach(function(d) { if (d !== dropdown) d.classList.remove('open'); });
    if (!isOpen) {
      var rect = label.getBoundingClientRect();
      dropdown.style.top = (rect.bottom + 4) + 'px';
      dropdown.style.left = rect.left + 'px';
      dropdown.classList.add('open');
    }
    return;
  }
  if (!e.target.closest('.district-group')) {
    document.querySelectorAll('.doc-btns.open').forEach(function(d) { d.classList.remove('open'); });
  }

  // 上传按钮点击
  var uploadBtn = e.target.closest('.upload-btn');
  if (uploadBtn) { openUploadModal(uploadBtn); return; }
  var replaceBtn = e.target.closest('.replace-btn');
  if (replaceBtn) { openUploadModal(replaceBtn); return; }
});

function openUploadModal(el) {
  currentUpload = {
    city: el.getAttribute('data-city'),
    unit: el.getAttribute('data-unit'),
    district: el.getAttribute('data-district'),
    key: el.getAttribute('data-key')
  };
  selectedFile = null;
  document.getElementById('uploadInfo').innerHTML =
    '<strong>市:</strong> ' + currentUpload.city + '<br>' +
    '<strong>作业单位:</strong> ' + currentUpload.unit + '<br>' +
    '<strong>区县:</strong> ' + currentUpload.district;
  document.getElementById('dropText').textContent = '点击或拖拽文件到此处';
  document.getElementById('confirmUpload').disabled = true;
  document.getElementById('fileInput').value = '';
  document.getElementById('uploadModal').classList.add('show');
}

function closeUploadModal() {
  document.getElementById('uploadModal').classList.remove('show');
  currentUpload = null;
  selectedFile = null;
}

document.getElementById('fileDrop').addEventListener('click', function() {
  document.getElementById('fileInput').click();
});

document.getElementById('fileDrop').addEventListener('dragover', function(e) {
  e.preventDefault(); this.classList.add('dragover');
});
document.getElementById('fileDrop').addEventListener('dragleave', function() {
  this.classList.remove('dragover');
});
document.getElementById('fileDrop').addEventListener('drop', function(e) {
  e.preventDefault(); this.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) handleFileSelect(e.dataTransfer.files[0]);
});

document.getElementById('fileInput').addEventListener('change', function() {
  if (this.files.length > 0) handleFileSelect(this.files[0]);
});

function handleFileSelect(file) {
  selectedFile = file;
  document.getElementById('dropText').innerHTML = '<span class="selected">✓ ' + file.name + '</span> (' + (file.size / 1024 / 1024).toFixed(2) + ' MB)';
  document.getElementById('confirmUpload').disabled = false;
}

function confirmUploadFile() {
  if (!selectedFile || !currentUpload) return;
  
  // 检查Token
  var token = getGitHubToken();
  if (!token) {
    closeUploadModal();
    openTokenModal();
    return;
  }
  
  var time = getNow();
  var ext = selectedFile.name.split('.').pop();
  var newFileName = currentUpload.key + '_整改答复_' + time + '.' + ext;

  // 显示上传中
  document.getElementById('confirmUpload').disabled = true;
  document.getElementById('confirmUpload').textContent = '上传中...';

  // 读取文件并通过 API 上传到 GitHub
  var reader = new FileReader();
  reader.onload = function(e) {
    var base64 = e.target.result.split(',')[1];
    var url = REPLY_BASE + '/' + newFileName;
    var path = 'replies/' + newFileName;

    fetch('https://api.github.com/repos/1337816143/soil-type-mapping-inventory/contents/' + path, {
      method: 'PUT',
      headers: { 'Authorization': 'token ' + getGitHubToken(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: '整改答复: ' + currentUpload.key, content: base64 })
    }).then(function(r) {
      if (r.ok) {
        replyIndex[currentUpload.key] = { file: newFileName, time: time };
        refreshAllTabs();
        closeUploadModal();
        showToast('上传成功');
      } else {
        r.json().then(function(err) {
          showToast('上传失败: ' + (err.message || ''), true);
        });
      }
    }).catch(function(err) {
      showToast('上传失败: ' + err.message, true);
    }).finally(function() {
      document.getElementById('confirmUpload').textContent = '确认上传';
      document.getElementById('confirmUpload').disabled = false;
    });
  };
  reader.readAsDataURL(selectedFile);
}

function getGitHubToken() {
  // 从 localStorage 读取 token
  return localStorage.getItem('gh_token') || '';
}

function openTokenModal() {
  document.getElementById('tokenInput').value = getGitHubToken();
  document.getElementById('tokenModal').classList.add('show');
}

function closeTokenModal() {
  document.getElementById('tokenModal').classList.remove('show');
}

function saveToken() {
  var token = document.getElementById('tokenInput').value.trim();
  if (!token) {
    showToast('请输入Token', true);
    return;
  }
  localStorage.setItem('gh_token', token);
  closeTokenModal();
  showToast('Token已保存，请重新点击上传');
}

function refreshAllTabs() {
  for (var key in tabData) {
    var el = document.querySelector('#tab-' + key + ' .content');
    if (el) el.innerHTML = renderCities(tabData[key]);
  }
}

function showToast(msg, isError) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast' + (isError ? ' error' : '');
  setTimeout(function() { toast.classList.add('show'); }, 10);
  setTimeout(function() { toast.classList.remove('show'); }, 3000);
}

// 点击弹窗外关闭
document.getElementById('uploadModal').addEventListener('click', function(e) {
  if (e.target === this) closeUploadModal();
});
document.getElementById('tokenModal').addEventListener('click', function(e) {
  if (e.target === this) closeTokenModal();
});
</script>
