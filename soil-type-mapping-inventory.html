      }
    });
    html += '</div></td><td>';
    batches.forEach(function(b) { html += '<span class="batch-tag ' + (batchClass[b]||'') + '">' + b + '</span>'; });
    html += '</td></tr>';
  });
  html += '</tbody></table></div></section>';
});

document.getElementById('content').innerHTML = html;

// 点击触发下拉菜单，解决遮挡和悬停缝隙问题
document.querySelectorAll('.group-label').forEach(function(label) {
  label.addEventListener('click', function(e) {
    e.stopPropagation();
    var group = this.parentElement;
    var dropdown = group.querySelector('.doc-btns');
    var isOpen = dropdown.classList.contains('open');

    // 关闭其他已打开的下拉菜单
    document.querySelectorAll('.doc-btns.open').forEach(function(d) {
      if (d !== dropdown) d.classList.remove('open');
    });

    if (!isOpen) {
      var rect = this.getBoundingClientRect();
      dropdown.style.top = (rect.bottom + 4) + 'px';
      dropdown.style.left = rect.left + 'px';
      dropdown.classList.add('open');
    }
  });
});

// 点击页面其他区域关闭下拉菜单
document.addEventListener('click', function(e) {
  if (!e.target.closest('.district-group')) {
    document.querySelectorAll('.doc-btns.open').forEach(function(d) {
      d.classList.remove('open');
    });
  }
});
})();
</script>

</body>
</html>
